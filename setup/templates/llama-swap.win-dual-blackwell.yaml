# llama-swap.win-dual-blackwell.yaml — offload-harness family on a HOMOGENEOUS pair of
# Blackwell (sm_120) cards, Windows. Reference box: RTX 5070 Ti 16GB (~896 GB/s, device 1
# by PCI bus order) + RTX 5060 Ti 16GB (~448 GB/s, x8 electrical, device 0), PCIe Gen3,
# no NVLink, no P2P. Design: 2026-08-02 dual-Blackwell tier research (Drive,
# Local-Offload-Harness/2026-08-02-blackwell-2x16-tier-research.md).
#
# TOPOLOGY RULE — PIN, DON'T SPLIT. Every model here fits one card and is pinned whole
# to it: splitting a fits-on-one-card model across the pair costs 20-33% tg (the cards
# run SEQUENTIALLY per token; effective bandwidth is the harmonic mean — 50/50 is
# ~597 GB/s vs 896 solo). Layer-split is reserved for future >16GB seats, never these.
#   FAST card  (CUDA_VISIBLE_DEVICES=1, 5070 Ti): latency primaries — e4b, e2b, 26B,
#     the vision seat. Kept CLEAN: the desktop/DWM lives on the utility card.
#   UTILITY card (CUDA_VISIBLE_DEVICES=0, 5060 Ti): the memory stack residents, the
#     STT seat, the desktop's ~0.5-1.5 GB VRAM tax.
# Device identity: indices follow CUDA_DEVICE_ORDER=PCI_BUS_ID (tier gpu_env) and match
# the reference box (bus 17:00 = 5060 Ti = 0, bus 65:00 = 5070 Ti = 1). VERIFY with
# nvidia-smi after any slot change or BIOS reset — this board reorders enumeration on
# power loss; swap the pins (or substitute GPU UUIDs, which CUDA_VISIBLE_DEVICES accepts)
# if the cards moved. A silent flip inverts every placement decision in this file.
#
# Serving invariants (grammar reliability — do NOT change): --jinja, --flash-attn on,
# no MTP flags on models without an MTP graph, reasoning off. Do NOT add --swa-full here
# (load-bearing for the LARGE iSWA models only). q8_0 V requires flash-attn on. q4_0 KV
# is BANNED (92% prefill degradation, measured).
healthCheckTimeout: 300
logLevel: info

macros:
  common: >-
    --ctx-size __CTX__ --flash-attn __FLASH_ATTN__ --cache-type-k __KV_K__ --cache-type-v __KV_V__
    --jinja --reasoning off --port ${PORT} --host 127.0.0.1

models:
  offload-e4b:
    aliases: [gemma4-e4b]
    env: [CUDA_VISIBLE_DEVICES=1]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
      -ngl 99 --parallel 1 ${common}
    ttl: 300
  gemma4-e2b:
    env: [CUDA_VISIBLE_DEVICES=1]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
      -ngl 99 ${common}
    ttl: 300
  gemma4-26b-a4b:
    env: [GGML_CUDA_DISABLE_GRAPHS=1, CUDA_VISIBLE_DEVICES=1]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      __MOE_26B__ --parallel 1 ${common}
    ttl: 300
  embeddinggemma:
    env: [CUDA_VISIBLE_DEVICES=0]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/embeddinggemma-300m-Q8_0.gguf
      --embedding --pooling mean --ctx-size 2048 --parallel 4 --port ${PORT} --host 127.0.0.1
    ttl: 600
  bge-reranker-v2-m3:
    env: [CUDA_VISIBLE_DEVICES=0]
    # -ngl 0 ON PURPOSE: the reranker on CPU is a measured house decision (buys back
    # VRAM for ~zero latency cost on its path) — same as the linux template.
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/bge-reranker-v2-m3-Q4_K_M.gguf
      --reranking --pooling rank --ctx-size 8192 --batch-size 4096 --ubatch-size 4096
      --parallel 4 --n-gpu-layers 0 --port ${PORT} --host 127.0.0.1
    ttl: 600

# RESIDENCY IS DECLARED WITH `matrix:` (llama-swap >= v202; groups' persistent:true was
# measured FAILING on this exact box — the memory stack silently degraded mem0 to
# dense-only). Residents appear in every set, so no request can be satisfied by
# evicting them. Verified against the real binary: `vars` is mandatory, var keys are
# alphanumeric 1-8 chars, set expressions reference ONLY var ids.
#
# THE TWO-CARD COMBINATION RULE this file exists for: the fast card's heavy seats are
# mutually exclusive ALTERNATIVES (one at a time on the 16GB card), while a
# utility-card seat joins as a CONJUNCTION — it may run CONCURRENTLY with any fast-card
# model, because it lives on the other card. That concurrency is the second card's
# whole payoff for the text/STT path.
#
# This template accepts tier-declared media seats: `swappable` joins the fast-card
# alternatives (pin such seats to device 1 via the seat's gpu_env); `resident` joins as
# a co-resident conjunction (pin those to device 0). A template without this directive
# refuses seats by name.
# offload-seats: swappable resident
matrix:
  vars:
    emb: embeddinggemma
    rer: bge-reranker-v2-m3
    e4b: offload-e4b
    e2b: gemma4-e2b
    m26: gemma4-26b-a4b
  # The memory stack is the most expensive thing on this box to lose and the cheapest
  # to keep: maximally expensive to stop, so the solver stops something else first.
  evict_costs:
    emb: 1000
    rer: 1000
  sets:
    residents: "emb & rer"
    text: "+residents & (e4b | e2b__M26_ALT____SEATS_SWAPPABLE__)__SEATS_RESIDENT__"
