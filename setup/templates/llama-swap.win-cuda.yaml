# llama-swap.win-cuda.yaml — offload-harness family on the llama.cpp CUDA backend
# (native Windows; NVIDIA GPU, verified on 8GB). Serving invariants (grammar
# reliability — do NOT change): --jinja, --flash-attn on, no MTP, reasoning off —
# the reasoning-off invariant binds the CASCADE seats; the *-agent entry below is
# explicitly a reasoning/thinking seat (agent loop), added 2026-08-16.
# Context size, KV cache type, flash-attn, and the 26B MoE placement are
# PROFILE-DRIVEN: install.ps1 (H2) substitutes the CTX / KV-K / KV-V / FLASH-ATTN
# / MOE-26B tokens in the common macro + 26B cmd from setup/templates/profiles.json,
# keyed on the detected profile id. q8_0 V requires flash-attn on (satisfied
# whenever a profile picks q8_0). Do NOT add --swa-full. MoE tier placement is
# profile-driven: an 8GB profile keeps ALL experts in RAM (--cpu-moe); a 6GB
# profile keeps only the top N expert layers in RAM (--n-cpu-moe N, the rest on
# GPU); a 16GB+ profile places experts on the GPU (full offload). The __MOE_26B__
# token carries whichever form the profile selected.
# GGML_CUDA_DISABLE_GRAPHS is now a TIER decision (profiles.json `disable_cuda_graphs`),
# not a template default. On sm_120 the flag cost 40-51% of generation on the 26B seats
# for no recorded reason (2026-09-05, b10720, 3 fresh-serve reps, temp 0, output
# IDENTICAL), so every Blackwell tier renders WITHOUT it. This template also serves the
# ampere-* and volta-16 tiers, which were never measured with graphs on and keep it.
healthCheckTimeout: 300
logLevel: info

macros:
  common: >-
    --ctx-size __CTX__ --flash-attn __FLASH_ATTN__ --cache-type-k __KV_K__ --cache-type-v __KV_V__ --cache-ram __CACHE_RAM__ __SLOT_SAVE__
    --jinja --reasoning off --port ${PORT} --host 127.0.0.1

models:
  offload-e4b:
    aliases: [gemma4-e4b]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
      -ngl 99 --parallel 1 ${common}
    ttl: 300
  gemma4-e2b:
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
      -ngl 99 ${common}
    ttl: 300
  gemma4-26b-a4b:
    env: [__M26_GRAPHS__]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      __MOE_26B__ --parallel 1 ${common}
    ttl: 300
  # AGENT seat: same 26B weights and geometry as the cascade seat above; the ONLY
  # difference is reasoning ON (thinking agent loop: 0/15 -> 12/15 at D1 with
  # reasoning on, 2026-08-10). Flags written explicitly rather than via ${common}
  # because the macro pins reasoning off. Exists whenever the 26B exists: the
  # renderer strips it together with the 26B when a tier (or the RAM gate) drops it.
  gemma-4-26b-agent:
    aliases: [26b-agent, gemma4-26b-agent]
    env: [__M26_GRAPHS__]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      __MOE_26B__ --parallel 1 --ctx-size __CTX__ --flash-attn __FLASH_ATTN__
      --cache-type-k __KV_K__ --cache-type-v __KV_V__ --cache-ram __CACHE_RAM__ __SLOT_SAVE__ --jinja --reasoning on
      --port ${PORT} --host 127.0.0.1
    ttl: 300
  # AGENT seat for the SMALL tiers: Qwen3.5-4B. Gated on the tier's
  # include_qwen35_4b, exactly as the 26B agent entry rides include_26b — the
  # renderer strips this block, its matrix var and its set membership together.
  # MEASURED 2026-08-17 (6GB-tier bake-off, RTX 3050): the only candidate of 15 that
  # is strong on BOTH task shapes — 67% extraction recall vs the e4b incumbent's 50%,
  # and 4/5 on search+reason where the higher-scoring 2B collapses to 1/5. 3681 MiB at
  # ctx 32768 q8_0, so it fits a 6GB card beside the resident support tier.
  #
  # Flags are written EXPLICITLY instead of via ${common} for one measured reason:
  # ${common} pins `--reasoning off`, and every score this seat was chosen on was
  # measured under llama.cpp's DEFAULT reasoning behaviour. Shipping a flag the
  # measurement never exercised would be shipping an unmeasured configuration.
  # NO sampling flags on purpose: the agent loop sends `temperature: 0` on every
  # request (internal/agent/client.go wireReq — the field has no omitempty and is
  # never assigned), so a server-side --temp/--top-p is inert on this lane.
  qwen3.5-4b-agent:
    aliases: [qwen35-4b, agent-seat]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/Qwen3.5-4B-UD-Q4_K_XL.gguf
      -ngl 99 --parallel 1 --ctx-size __CTX__ --flash-attn __FLASH_ATTN__
      --cache-type-k __KV_K__ --cache-type-v __KV_V__ --cache-ram __CACHE_RAM__ __SLOT_SAVE__ --jinja
      --port ${PORT} --host 127.0.0.1
    ttl: 300
  # AGENT seat for the 8GB tiers: Qwen3.5-9B. Gated on the tier's
  # include_qwen35_9b, exactly as the 4B entry rides include_qwen35_4b — the
  # renderer strips this block, its matrix var and its set membership together.
  # Mutually exclusive with the 4B seat (shared `agent-seat` alias); the renderer
  # refuses a tier that sets both.
  # MEASURED 2026-08-22 (blackwell-8 quality bake, RTX 5060 8GB reference box,
  # on-box, fresh server per rep, n=2 per shape): 100% extraction recall x2 and
  # 5/5 search+reason x2 where the tier's E4B fallback planner scored 0% x2 (zero
  # tool calls); 6344 MiB at ctx 16384 q8_0 and 6696 MiB at ctx 32768 — the
  # Gated-DeltaNet hybrid's small KV is why a 9B fits an 8GB card at 32K. Served
  # at an explicit 32768 (measured fit; headroom for per-call profiles — the
  # tier's agent_ctx_tokens stays the loop's compaction budget).
  # Flags are EXPLICIT, not ${common}: ${common} pins `--reasoning off`, the 4B
  # seat's measured collapse trap for this THINKING family. Thinking is pinned OFF
  # via the env twin LLAMA_ARG_CHAT_TEMPLATE_KWARGS, NOT left to the default.
  # MEASURED 2026-08-25 on llama.cpp b10615 (Aorus + OptiPlex, live): the old claim
  # that llama.cpp defaults this template to thinking OFF is FALSE on this build.
  # The seat served with reasoning_content populated and, at a small max_tokens,
  # returned EMPTY content (174 to 2 completion tokens after the fix). The CLI form
  # cannot be used: llama-swap's tokenizer strips the inner quotes of the
  # chat-template-kwargs flag (json parse_error) and reasoning-budget 0 is inert;
  # the env var is the working channel. Thinking ON was measured WORSE: 89%
  # extraction with reasoning prose leaking into content at 3.5x the wall.
  # Never enable thinking on this seat without a re-bake.
  # NO sampling flags on purpose: the agent loop sends `temperature: 0` on every
  # request (internal/agent/client.go wireReq), so server-side sampling is inert.
  qwen3.5-9b-agent:
    aliases: [qwen35-9b__Q359B_AGENT_ALIAS__]
    env: ['LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"enable_thinking":false}']
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/Qwen3.5-9B-UD-Q4_K_XL.gguf
      -ngl 999 --parallel 1 --ctx-size 32768 --flash-attn __FLASH_ATTN__
      --cache-type-k __KV_K__ --cache-type-v __KV_V__ --cache-ram __CACHE_RAM__ __SLOT_SAVE__ --jinja
      --port ${PORT} --host 127.0.0.1
    ttl: 300
  # SECOND AGENT seat for the 8GB tiers: MiMo-V2.6-Distill-Qwen-9B (bartowski GGUF
  # Q4_K_M). Gated on the tier's include_mimo_9b, exactly as qwen3.5-9b-agent rides
  # include_qwen35_9b — the renderer strips this block, its matrix var and its set
  # membership together. Claims the SAME `agent-seat` alias as qwen3.5-9b-agent: the
  # renderer refuses include_mimo_9b with include_qwen35_4b (both would claim it), but
  # PERMITS it beside include_qwen35_9b — the two render TOGETHER, qwen3.5-9b-agent
  # stays the ROLLBACK seat and loses its `agent-seat` alias (the __Q359B_AGENT_ALIAS__
  # token above renders empty once this seat is included), and mimo-9b-agent is the
  # one config_seed.agent_model actually names.
  # REQUIRES llama.cpp >= b11102: on b10964 the chat-template auto-detector routes
  # MiMo's compact tool-call XML (`<tool_call><function=...>` with no newlines) to the
  # Qwen3-Coder parser, which waits on a `\n</parameter>` that never comes, so every
  # tool call runs to the token cap (upstream llama.cpp #29319; fixed in
  # common/chat.cpp by excluding that template, present b11153). MiMo failed every
  # agent run on b10964 for exactly this reason.
  # MEASURED 2026-09-24 (both 8GB reference boxes; RTX 5060 8GB and RTX 3070 Laptop
  # 8GB): fit at ctx 65536, q8_0 KV, flash-attn on (engine-independent — same VRAM on
  # b10964 and b11153) is 6,926 MiB loaded / 7,034 MiB peak on the 5060 and 6,683 /
  # 6,707 MiB on the 3070 Laptop — both smaller than qwen3.5-9b-agent's 7,044/7,154
  # and 6,801/6,827 at the same window. Quality bake (agent-seat instrument, gold.py
  # grader, fresh server per rep, n=3, ctx 65536, llama.cpp b11153): shape B 18/18 x6
  # both boxes, shape C 5/5 x3 on the 5060 and 4/5 x3 on the 3070 Laptop — a tie at
  # the test's ceiling against qwen3.5-9b-agent (same scores; q2 cross-file
  # arithmetic flips by box/engine). `--reasoning off` was byte-identical to
  # `--chat-template-kwargs {"enable_thinking":false}` on all 12 quality runs, so
  # this seat pins the plain CLI flag rather than qwen3.5-9b-agent's env-twin
  # workaround. Ctx 65536 and the flash-attn/cache-type values are LITERALS (not the
  # tier macros): this is the exact configuration the fit and quality bakes measured.
  mimo-9b-agent:
    aliases: [mimo-9b, agent-seat]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/MiMo-V2.6-Distill-Qwen-9B-Q4_K_M.gguf
      -ngl 999 --parallel 1 --ctx-size 65536 --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0 --reasoning off --jinja
      --port ${PORT} --host 127.0.0.1
    ttl: 300
  # AGENT seat for the 16GB class — see the linux-cuda template for the full rationale.
  # Literal --ctx-size 49152 (measured fit), MTP head embedded in the GGUF, and no
  # `agent-seat` alias so the smaller entry stays the fallback.
  qwen38-27b-agent:
    aliases: [qwen38-27b, 27b-agent]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/Qwen3.8-27B-UD-IQ3_S.gguf
      --spec-type draft-mtp --spec-draft-n-max 3
      -ngl 999 --parallel 1 --ctx-size 49152 --flash-attn __FLASH_ATTN__
      --cache-type-k __KV_K__ --cache-type-v __KV_V__ --cache-ram __CACHE_RAM__ __SLOT_SAVE__ --jinja --reasoning off
      --port ${PORT} --host 127.0.0.1
    ttl: 300
  embeddinggemma:
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/embeddinggemma-300m-Q8_0.gguf
      --embedding --pooling mean --ctx-size 2048 --parallel 4 --port ${PORT} --host 127.0.0.1
    ttl: 300

# RESIDENCY IS DECLARED WITH `matrix:`, NOT `groups:` (llama-swap >= v202; a config
# uses one or the other, never both). This replaces a topology that was measurably
# wrong: `offload-family` was `swap: true` + **`exclusive: true`** while
# `embeddinggemma` belonged to NO group, and an exclusive group unloads everything
# outside itself — so loading any chat model evicted the embedder, and the next
# embedding call paid a full reload. The same shape on the Linux node was measured
# dropping free VRAM 3655 -> 1005 MiB and making one RAG query pay three model loads.
#
# Matrix states the valid CONCURRENT COMBINATIONS instead. `emb` is in every set, so
# the solver may never evict it to satisfy anything else; the chat tiers stay mutually
# exclusive, which is all `offload-family` was actually trying to say.
#
# Verified against the real binary: `vars` is mandatory, a var key must be alphanumeric
# and 1-8 characters, and a set expression may reference ONLY var ids.
# This template accepts tier-declared media seats. A tier declares a residency ROLE,
# never a set name: set names are per-template while a tier is a hardware class that
# renders into several templates. The SEATS_SWAPPABLE / SEATS_RESIDENT markers in the
# set expressions below (each wrapped in double underscores) say WHERE a seat of that
# role joins the matrix. No `env=` here on purpose: a Windows llama-server build is
# self-contained, so there is no loader-path macro to carry (the Linux template's `ld`
# has no equivalent). A template WITHOUT this directive renders no seats and refuses by
# name rather than dropping them silently.
# offload-seats: swappable resident
matrix:
  vars:
    emb: embeddinggemma
    e4b: offload-e4b
    e2b: gemma4-e2b
    m26: gemma4-26b-a4b
    a26: gemma-4-26b-agent
    q354: qwen3.5-4b-agent
    q359: qwen3.5-9b-agent
    mimo9: mimo-9b-agent
    q3827: qwen38-27b-agent
  evict_costs:
    emb: 1000
  sets:
    residents: "emb__SEATS_RESIDENT__"
    interactive: "+residents & (e4b | e2b__M26_ALT____Q354B_ALT____Q359B_ALT____MIMO9B_ALT____Q3827B_ALT____SEATS_SWAPPABLE__)"
