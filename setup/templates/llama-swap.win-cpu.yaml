# llama-swap.win-cpu.yaml — offload-harness family on the llama.cpp CPU backend
# (native Windows; no GPU offload). Serving invariants (grammar reliability —
# do NOT change): --jinja, no MTP, reasoning off. All layers run on CPU
# (no -ngl, no --flash-attn); --threads is set to the physical-core count by
# install.ps1. Context size + KV type are PROFILE-DRIVEN: install.ps1 (H2)
# substitutes the CTX / KV-K / KV-V tokens from setup/templates/profiles.json (the
# 'cpu' profile projects 8K/f16). The 26b MoE tier is OPTIONAL on CPU: it needs >=48GB
# RAM, so install.ps1 keeps it when ram_tier is mid OR high (>= ~56GB) and drops it
# (from both this file and the group members) on low/min.
healthCheckTimeout: 300
logLevel: info

macros:
  common: >-
    --ctx-size __CTX__ --cache-type-k __KV_K__ --cache-type-v __KV_V__
    --jinja --reasoning off --threads __NTHREADS__ --port ${PORT} --host 127.0.0.1

models:
  offload-e4b:
    aliases: [gemma4-e4b]
    cmd: >-
      __LLAMA_BIN__\llama-server.exe -m __MODELS__\gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
      --parallel 1 ${common}
    ttl: 300
  gemma4-e2b:
    cmd: >-
      __LLAMA_BIN__\llama-server.exe -m __MODELS__\gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
      ${common}
    ttl: 300
  # gemma4-26b-a4b: OPTIONAL on CPU — needs >=48GB RAM. Also remove from the
  # offload-family members list below if you do not install this model.
  gemma4-26b-a4b:
    cmd: >-
      __LLAMA_BIN__\llama-server.exe -m __MODELS__\gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --parallel 1 ${common}
    ttl: 300
  embeddinggemma:
    cmd: >-
      __LLAMA_BIN__\llama-server.exe -m __MODELS__\embeddinggemma-300m-Q8_0.gguf
      --embedding --pooling mean --ctx-size 2048 --parallel 4 --threads __NTHREADS__ --port ${PORT} --host 127.0.0.1
    ttl: 600

# RESIDENCY IS DECLARED WITH `matrix:`, NOT `groups:` (llama-swap >= v202; a config
# uses one or the other, never both). This replaces a topology that was measurably
# wrong: `offload-family` was `swap: true` + **`exclusive: true`** while
# `embeddinggemma` belonged to NO group, and an exclusive group unloads everything
# outside itself — so loading any chat model evicted the embedder. On a CPU tier the
# reload is paid in RAM bandwidth rather than VRAM, but it is the same wasted work.
#
# Matrix states the valid CONCURRENT COMBINATIONS instead. `emb` is in every set, so
# the solver may never evict it to satisfy anything else; the chat tiers stay mutually
# exclusive, which is all `offload-family` was actually trying to say.
#
# Verified against the real binary: `vars` is mandatory, a var key must be alphanumeric
# and 1-8 characters, and a set expression may reference ONLY var ids.
matrix:
  vars:
    emb: embeddinggemma
    e4b: offload-e4b
    e2b: gemma4-e2b
    m26: gemma4-26b-a4b
  evict_costs:
    emb: 1000
  sets:
    residents: "emb"
    interactive: "+residents & (e4b | e2b__M26_ALT__)"
