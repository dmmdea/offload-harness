# llama-swap.win-triple-blackwell.yaml - offload-harness family on THREE homogeneous
# Blackwell (sm_120) 16GB cards = 48.9 GB, Windows. Reference box IS the workstation:
# RTX 5060 Ti @17:00.0 (device 0) + RTX 5070 Ti @65:00.0 (device 1, DISPLAY) +
# RTX 5060 Ti @B5:00.0 (device 2), X299 / i9-10980XE, quad-channel DDR4-3400 128GB.
# Shipped 0.113.32. Evidence: Benchmarks and Optimizations/2026-08-31-48gb-gates-NOTES.md.
#
# PLACEMENT LAW - THE THIRD CARD IS NOT A THIRD WORKER. Measured, operator-set:
#   devices 0 and 2 (the 5060 Ti PAIR): every seat the harness serves by default.
#     Anything that fits two cards runs HERE.
#   device 1 (RTX 5070 Ti, ~896 GB/s, DISPLAY ENABLED): CONTEXT/KV ONLY - operator
#     decision 2026-09-07, taken against the numbers below. It joins only for the
#     explicitly opt-in over-2-card seats at the end of this file, under a >=4 GiB
#     desktop floor, and NEVER while the operator is at the desk. No tier seat and no
#     media pool is ever PINNED to it.
#     Measured 2026-09-04: a 3-card engine at util 0.87-0.90 left this card under 1 GB,
#     Windows dropped to a 720p-class mode and the operator had to reboot (clean event
#     log, no TDR - starvation, not a crash).
#     Why not a seat here: the vision seat measures 11,751 MiB (2026-09-05 CUDA-X
#     baseline), which after the ~0.5-1.5 GB DWM tax leaves ~3.5 GiB - UNDER the floor.
#
# THE MEDIA POOLS RUN ON THE 5060 Ti PAIR, WHICH IS cuda:1/cuda:2 IN ComfyUI'S ORDER.
# Those keys live in the tier's config_seed, not in this yaml, so nothing here can
# enforce them - the Go gate TestTripleBlackwellNeverSchedulesOntoTheDisplayCard does.
#   imagegen  compute cuda:1  donor cuda:2  - bf16 (krea2 turbo), free to sit anywhere;
#                                             re-verified on the pair 2026-09-01.
#   videogen  compute cuda:0  donor cuda:1  - THE ONE LAW EXCEPTION, and it must stay:
#     an int8 DiT cannot compute on a non-default CUDA device (ComfyUI-MultiGPU #220),
#     and the 2026-09-01 attempt to move it threw cudaErrorIllegalAddress mid-render.
# 0.113.32 shipped this tier's ENTIRE media block copied byte-for-byte from
# blackwell-2x16, whose gpu_env map is 0=utility / 1=FAST: that put the vision seat on
# the display card, left image compute on it too, and named card 2 nowhere - which is
# also why the 3-card box measured no media difference from the 2-card one. It was a
# copy nobody adapted, not a hardware result.
#
# WHAT THE THIRD CARD ACTUALLY BUYS (operator directive: "bigger context and more
# capability in general, not necessarily to pool for a bigger model"). Measured:
# llama.cpp's 3-way aggregate ceiling is 134.4 tok/s at c32 vs the pair's 110-120
# (+10-20%), and pipeline-parallel vLLM is ~8% SLOWER single-stream than tensor-parallel
# on two cards because stages serialize. The real win is KV pool and headroom:
# 137,898 tokens across three cards vs 78,506 across two.
#
# TOPOLOGY RULE - PIN, DON'T SPLIT, for anything that fits one card: splitting a
# fits-on-one-card model costs 20-33% tg (sequential per-token, harmonic-mean bandwidth).
# Layer-split is reserved for the >16GB opt-in seats at the end.
#
# DEVICE IDENTITY - PIN BY UUID IF THE CARDS MOVE. Indices follow CUDA_DEVICE_ORDER=
# PCI_BUS_ID (tier gpu_env). TWO OF THE THREE CARDS REPORT THE IDENTICAL BOARD NAME
# "RTX 5060 Ti", and CUDA/ComfyUI ordering does not match nvidia-smi PCI order, so a
# name-based check cannot tell them apart. VERIFY with nvidia-smi after any slot change
# or BIOS reset - this board reorders enumeration on power loss. CUDA_VISIBLE_DEVICES
# accepts GPU UUIDs; substitute them if the cards moved. A silent flip puts a heavy seat
# on the display card and starves the desktop.
#
# CUDA GRAPHS ARE ON for the 26B seats. The GGML_CUDA_DISABLE_GRAPHS=1 that used to sit
# here was cargo - it predated every retained yaml backup with no recorded reason.
# Measured 2026-09-05 (b10720, 3 fresh-serve reps, temp 0, exact-string gate): gen
# 41.4 -> 58.0 t/s (gemma-4-26b) and 39.0 -> 58.8 t/s (gemma-4-26b-agent), prefill
# unchanged, output identical, GBNF grammar path fine. GGML_CUDA_GRAPH_OPT stays OFF:
# it changes exact output on e4b/e2b/vl-8b/26b and crashes the MTP 12b.
#
# Serving invariants (grammar reliability - do NOT change): --jinja, --flash-attn on,
# no MTP flags on models without an MTP graph, reasoning off - the reasoning-off
# invariant binds the CASCADE seats; the *-agent and qwen3.8 entries are explicitly
# reasoning/thinking seats. Do NOT add --swa-full here. q8_0 V requires flash-attn on.
# q4_0 KV is BANNED (92% prefill degradation, measured).
# 600, not the old 300: this template renders the Flash-Next opt-in seats, whose cold
# load runs 219 s and beyond (the reference box raised its own ceiling to 600 for
# exactly them). A CEILING, not a wait - a broken small seat still fails fast.
healthCheckTimeout: 600
logLevel: info

macros:
  common: >-
    --ctx-size __CTX__ --flash-attn __FLASH_ATTN__ --cache-type-k __KV_K__ --cache-type-v __KV_V__
    --jinja --reasoning off --port ${PORT} --host 127.0.0.1

models:
  offload-e4b:
    aliases: [gemma4-e4b]
    env: [CUDA_VISIBLE_DEVICES=0]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
      -ngl 99 --parallel 1 ${common}
    ttl: 300
  gemma4-e2b:
    env: [CUDA_VISIBLE_DEVICES=0]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
      -ngl 99 ${common}
    ttl: 300
  gemma4-26b-a4b:
    env: [CUDA_VISIBLE_DEVICES=0]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      __MOE_26B__ --parallel 1 ${common}
    ttl: 300
  # AGENT seat: the flagship's rollback seat, matching the live reference box. Same
  # 26B weights and geometry as the cascade seat above; the ONLY difference is
  # reasoning ON (thinking agent loop). Flags written explicitly rather than via
  # ${common} because the macro pins reasoning off. Exists whenever the 26B exists:
  # the renderer strips it together with the 26B when a tier drops it.
  gemma-4-26b-agent:
    aliases: [26b-agent, gemma4-26b-agent]
    env: [CUDA_VISIBLE_DEVICES=0]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      __MOE_26B__ --parallel 1 --ctx-size __CTX__ --flash-attn __FLASH_ATTN__
      --cache-type-k __KV_K__ --cache-type-v __KV_V__ --jinja --reasoning on
      --port ${PORT} --host 127.0.0.1
    ttl: 300
  # CODER + AGENT seat: Seat Frontier Leg 1 winner (2026-08-14) — Qwen3.8-27B
  # UD-Q4_K_XL, pooled across BOTH cards (-sm layer: 16.7GB does not fit one 16GB
  # card next to KV). Thinking model: it must NOT take ${common} (the macro pins
  # --reasoning off); sampling is the Unsloth thinking-mode recipe. Rendered only
  # when the tier sets include_qwen38 (the Q38 token pair mirrors the M26 one).
  qwen3.8-27b:
    aliases: [qwen38, local-coder, coder, agent-loop]
    # PINNED TO THE 5060 Ti PAIR. This seat carries -sm layer -ngl 999, so with all
    # three cards visible it spreads across the DISPLAY card - which is exactly what
    # the reference box hit: its own entry records "Old split 21,29 spanned
    # 5070Ti+5060Ti by CUDA fastest-first" and was RE-PINNED 2026-08-31 under the
    # operator rule "DUAL-CARD seats -> the 5060 Ti PAIR, pinned by BOTH UUIDs. NEVER
    # the 5070 Ti." It was the last unpinned default seat in this template.
    # NO --tensor-split here on purpose. The live box uses 24,26, justified by which
    # of ITS cards holds the ~2 GB utility residents - and this template puts those
    # residents on the other card of the pair, so the ratio does not transfer. -sm
    # layer auto-divides the 16.7 GB evenly, which fits either way; measure on the box
    # before pinning a ratio. Prefer GPU UUIDs over indices if the cards ever move.
    env: [CUDA_VISIBLE_DEVICES=0,2]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/Qwen3.8-27B-UD-Q4_K_XL.gguf
      --mmproj __MODELS__/mmproj-Qwen3.8-27B-F16.gguf -ngl 999 -sm layer --parallel 1
      --jinja --flash-attn __FLASH_ATTN__ --cache-type-k __KV_K__ --cache-type-v __KV_V__
      --ctx-size __CTX__ --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --port ${PORT} --host 127.0.0.1
    ttl: 300
  # LONG-CONTEXT TWIN of the 27B (2026-09-10, operator: the third card buys CONTEXT and the
  # 3-card tier must register more than the 2-card tier). Same weights and pair pin, q8_0 KV,
  # NO MTP drafter (q8_0 + MTP OOMs at MTP-context init, ledger G3 2026-09-01), no mmproj,
  # --ctx-size 262144 as a LITERAL (profile long_ctx_size), measured live on the reference box.
  # Swappable, ttl 300 like every seat. The composite tier routes window overflow here; the
  # vLLM long layer (pp3, fp8 KV, 262,144 measured Nightshift 2 seat v7) ships with 0.116.0.
  qwen3.8-27b-262k:
    aliases: [qwen38-262k, coder-262k, agent-loop-262k]
    env: [CUDA_VISIBLE_DEVICES=0,2]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/Qwen3.8-27B-UD-Q4_K_XL.gguf
      -ngl 999 -sm layer --parallel 1 --jinja --flash-attn __FLASH_ATTN__
      --cache-type-k __KV_K__ --cache-type-v __KV_V__
      --ctx-size 262144 --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --port ${PORT} --host 127.0.0.1
    ttl: 300
  embeddinggemma:
    env: [CUDA_VISIBLE_DEVICES=2]
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/embeddinggemma-300m-Q8_0.gguf
      --embedding --pooling mean --ctx-size 2048 --parallel 4 --port ${PORT} --host 127.0.0.1
    ttl: 300
  bge-reranker-v2-m3:
    env: [CUDA_VISIBLE_DEVICES=2]
    # -ngl 99 on THIS tier (operator decision 2026-08-13): a 16GB-class utility card
    # fits the ~360MB Q4 weights trivially, and CPU serving cost 2.4-4.6s per 20-doc
    # rerank vs ~143ms typical / ~1.2s worst-case on GPU (measured on the reference
    # dual-Blackwell box). The old "-ngl 0 buys back VRAM for ~zero latency cost" note
    # was an 8GB-era carryover — it remains CORRECT for small-VRAM tiers: the linux
    # (Lenovo-class) template ran it at -ngl 0 until 0.115.4; every template now serves it on the card (RAM is overflow only, operator 2026-09-10). Raw-logit scores are
    # device-independent, so admission-gate threshold calibration is unaffected.
    cmd: >-
      __LLAMA_BIN__/llama-server.exe -m __MODELS__/bge-reranker-v2-m3-Q4_K_M.gguf
      --reranking --pooling rank --ctx-size 8192 --batch-size 4096 --ubatch-size 4096
      --parallel 4 -ngl 99 --port ${PORT} --host 127.0.0.1
    ttl: 300



# RESIDENCY IS DECLARED WITH `matrix:` (llama-swap >= v202; groups' persistent:true was
# measured FAILING on this exact box — the memory stack silently degraded mem0 to
# dense-only). Residents appear in every set, so no request can be satisfied by
# evicting them. Verified against the real binary: `vars` is mandatory, var keys are
# alphanumeric 1-8 chars, set expressions reference ONLY var ids.
#
# THE TWO-CARD COMBINATION RULE this file exists for: the fast card's heavy seats are
# mutually exclusive ALTERNATIVES (one at a time on the 16GB card), while a
# utility-card seat joins as a CONJUNCTION — it may run CONCURRENTLY with any fast-card
# model, because it lives on the other card. That concurrency is the second card's
# whole payoff for the text/STT path.
#
# This template accepts tier-declared media seats: `swappable` joins the primary-card
# alternatives, `resident` joins as a co-resident conjunction. THE RESIDENCY ROLE SAYS
# HOW A SEAT COMBINES, NOT WHICH CARD IT SITS ON - the card is the seat's own gpu_env.
# On this box the 2026-08-31 singles rebalance put BOTH media seats on device 2
# (5060Ti#2): whisper, vl-8b/ocr and the embed/rerank alternates moved there while the
# cascade + memory-stack residents stayed on device 0, and the CUDA-X baseline
# re-measured vl-8b at 11,751 MiB on card 2. An earlier version of this comment said
# "swappable -> device 0, resident -> device 2", which was a two-card-era shorthand the
# reference deployment does not follow.
# NEVER pin a tier media seat to device 1 - that is the display card. A template
# without this directive refuses seats by name.
#
# WATCH THE ORDERING WHEN YOU READ A "1" HERE. gpu_env is CUDA_VISIBLE_DEVICES under
# CUDA_DEVICE_ORDER=PCI_BUS_ID, where 1 is the 5070 Ti. The tier's ComfyUI pool keys
# (imagegen_pool_*/videogen_pool_*, "cuda:N") use ComfyUI's FASTEST-FIRST order, where
# cuda:0 is the 5070 Ti and cuda:1/cuda:2 are the pair. The same digit means different
# cards in the two namespaces, and confusing them is how the media block ended up
# pointing at the display card twice.
# offload-seats: swappable resident
matrix:
  vars:
    emb: embeddinggemma
    rer: bge-reranker-v2-m3
    e4b: offload-e4b
    e2b: gemma4-e2b
    m26: gemma4-26b-a4b
    a26: gemma-4-26b-agent
    q38: qwen3.8-27b
    q38l: qwen3.8-27b-262k
  # The memory stack is the most expensive thing on this box to lose and the cheapest
  # to keep: maximally expensive to stop, so the solver stops something else first.
  evict_costs:
    emb: 1000
    rer: 1000
  sets:
    residents: "emb & rer"
    text: "+residents & (e4b | e2b__M26_ALT____Q38_ALT__ | q38l__SEATS_SWAPPABLE__)__SEATS_RESIDENT__"
