# llama-swap.linux-cuda.yaml — offload-harness family on the llama.cpp CUDA backend
# (Linux; NVIDIA GPU). Rendered by `local-offload install render`, which substitutes
# the __CTX__ / __KV_K__ / __KV_V__ / __FLASH_ATTN__ / __MOE_26B__ / __LLAMA_BIN__ /
# __MODELS__ / __NTHREADS__ / __LISTEN__ tokens from the detected tier and drops the
# 26B block entirely on a tier whose include_26b is false.
#
# Serving invariants (grammar reliability — do NOT change): --jinja, --flash-attn on,
# no MTP, reasoning off — the reasoning-off invariant binds the CASCADE seats; the
# *-agent entry below is explicitly a reasoning/thinking seat (agent loop), added
# 2026-08-16. Do NOT add --swa-full here: it was measured as load-bearing
# for the LARGE iSWA models only, and forcing a full attention window costs KV memory
# on exactly the tiers with the least VRAM headroom.
#
# LINUX-SPECIFIC AND LOAD-BEARING: every seat carries LD_LIBRARY_PATH pointing at the
# llama.cpp build dir. A self-built llama-server links its own shared objects; without
# it the process dies at exec with a loader error that looks nothing like a config
# problem. The Windows templates have no equivalent, which is one reason this file
# could not be a translation of them.
healthCheckTimeout: 300
logLevel: info
listen: __LISTEN__

macros:
  common: >-
    --ctx-size __CTX__ --flash-attn __FLASH_ATTN__ --cache-type-k __KV_K__ --cache-type-v __KV_V__ --cache-ram __CACHE_RAM__ __SLOT_SAVE__
    --threads __NTHREADS__ --jinja --reasoning off --port ${PORT} --host 127.0.0.1
  ld: "LD_LIBRARY_PATH=__LLAMA_BIN__:${LD_LIBRARY_PATH:-}"

models:
  offload-e4b:
    aliases: [gemma4-e4b, offload]
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
      --n-gpu-layers 99 --parallel 1 ${common}
    checkEndpoint: /health
    ttl: 300
  gemma4-e2b:
    aliases: [e2b]
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
      --n-gpu-layers 99 ${common}
    checkEndpoint: /health
    ttl: 300
  gemma4-26b-a4b:
    env: [__M26_GRAPHS__, "${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      __MOE_26B__ --parallel 1 ${common}
    checkEndpoint: /health
    ttl: 300
  # AGENT seat: same 26B weights and geometry as the cascade seat above; the ONLY
  # difference is reasoning ON (thinking agent loop). Flags written explicitly
  # rather than via ${common} because the macro pins reasoning off. Exists whenever
  # the 26B exists: the renderer strips it together with the 26B when a tier (or
  # the RAM gate) drops it. A tier is a HARDWARE class, so the seat the Windows
  # templates serve must exist here too — same tier, same capabilities.
  gemma-4-26b-agent:
    aliases: [26b-agent, gemma4-26b-agent]
    env: [__M26_GRAPHS__, "${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      __MOE_26B__ --parallel 1 --ctx-size __CTX__ --flash-attn __FLASH_ATTN__
      --cache-type-k __KV_K__ --cache-type-v __KV_V__ --cache-ram __CACHE_RAM__ __SLOT_SAVE__ --threads __NTHREADS__
      --jinja --reasoning on --port ${PORT} --host 127.0.0.1
    checkEndpoint: /health
    ttl: 300
  # AGENT seat for the SMALL tiers: Qwen3.5-4B. Gated on the tier's
  # include_qwen35_4b, exactly as the 26B agent entry rides include_26b — the
  # renderer strips this block, its matrix var and its set membership together.
  # MEASURED 2026-08-17 (6GB-tier bake-off, RTX 3050): the only candidate of 15 that
  # is strong on BOTH task shapes — 67% extraction recall vs the e4b incumbent's 50%,
  # and 4/5 on search+reason where the higher-scoring 2B collapses to 1/5. 3681 MiB at
  # ctx 32768 q8_0, so it fits a 6GB card beside the resident support tier.
  #
  # Flags are written EXPLICITLY instead of via ${common} for one measured reason:
  # ${common} pins `--reasoning off`, and every score this seat was chosen on was
  # measured under llama.cpp's DEFAULT reasoning behaviour. Shipping a flag the
  # measurement never exercised would be shipping an unmeasured configuration.
  # NO sampling flags on purpose: the agent loop sends `temperature: 0` on every
  # request (internal/agent/client.go wireReq — the field has no omitempty and is
  # never assigned), so a server-side --temp/--top-p is inert on this lane.
  #
  # The Q354B_AGENT_ALIAS token below drops this entry's claim on `agent-seat` when
  # mimo-9b-agent ALSO renders (2026-09-24), or when the Qwen3.6-35B-A3B spill seat
  # below renders (2026-10-09): they share the alias, and this seat stays as the
  # tier's un-aliased ROLLBACK (an opt-in entry the lane can be pointed back at)
  # rather than being refused outright — the mirror of qwen3.5-9b-agent's own
  # Q359B_AGENT_ALIAS token below.
  qwen3.5-4b-agent:
    aliases: [qwen35-4b__Q354B_AGENT_ALIAS__]
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/Qwen3.5-4B-UD-Q4_K_XL.gguf
      --n-gpu-layers 99 --parallel 1 --ctx-size __CTX__ --flash-attn __FLASH_ATTN__
      --cache-type-k __KV_K__ --cache-type-v __KV_V__ --cache-ram __CACHE_RAM__ __SLOT_SAVE__ --threads __NTHREADS__
      --jinja --port ${PORT} --host 127.0.0.1
    checkEndpoint: /health
    ttl: 300
  # AGENT seat for the 8GB tiers: Qwen3.5-9B. Gated on the tier's
  # include_qwen35_9b, exactly as the 4B entry rides include_qwen35_4b — the
  # renderer strips this block, its matrix var and its set membership together.
  # Mutually exclusive with the 4B seat (shared `agent-seat` alias); the renderer
  # refuses a tier that sets both.
  # MEASURED 2026-08-22 (blackwell-8 quality bake, RTX 5060 8GB reference box,
  # on-box, fresh server per rep, n=2 per shape): 100% extraction recall x2 and
  # 5/5 search+reason x2 where the tier's E4B fallback planner scored 0% x2 (zero
  # tool calls); 6344 MiB at ctx 16384 q8_0 and 6696 MiB at ctx 32768 — the
  # Gated-DeltaNet hybrid's small KV is why a 9B fits an 8GB card at 32K. Served
  # at an explicit 32768 (measured fit; headroom for per-call profiles — the
  # tier's agent_ctx_tokens stays the loop's compaction budget).
  # Flags are EXPLICIT, not ${common}: ${common} pins `--reasoning off`, the 4B
  # seat's measured collapse trap for this THINKING family. Thinking is pinned OFF
  # via the env twin LLAMA_ARG_CHAT_TEMPLATE_KWARGS, NOT left to the default.
  # MEASURED 2026-08-25 on llama.cpp b10615 (<node-a> + <node-e>, live): the old claim
  # that llama.cpp defaults this template to thinking OFF is FALSE on this build.
  # The seat served with reasoning_content populated and, at a small max_tokens,
  # returned EMPTY content (174 to 2 completion tokens after the fix). The CLI form
  # cannot be used: llama-swap's tokenizer strips the inner quotes of the
  # chat-template-kwargs flag (json parse_error) and reasoning-budget 0 is inert;
  # the env var is the working channel. Thinking ON was measured WORSE: 89%
  # extraction with reasoning prose leaking into content at 3.5x the wall.
  # Never enable thinking on this seat without a re-bake.
  # NO sampling flags on purpose: the agent loop sends `temperature: 0` on every
  # request (internal/agent/client.go wireReq), so server-side sampling is inert.
  qwen3.5-9b-agent:
    aliases: [qwen35-9b__Q359B_AGENT_ALIAS__]
    env: ["${ld}", 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"enable_thinking":false}']
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/Qwen3.5-9B-UD-Q4_K_XL.gguf
      --n-gpu-layers 999 --parallel 1 --ctx-size 32768 --flash-attn __FLASH_ATTN__
      --cache-type-k __KV_K__ --cache-type-v __KV_V__ --cache-ram __CACHE_RAM__ __SLOT_SAVE__ --threads __NTHREADS__
      --jinja --port ${PORT} --host 127.0.0.1
    checkEndpoint: /health
    ttl: 300
  # SECOND AGENT seat for the 8GB tiers: MiMo-V2.6-Distill-Qwen-9B (bartowski GGUF
  # Q4_K_M) — see the win-cuda template for the full rationale and measurements.
  # Gated on include_mimo_9b; claims the SAME `agent-seat` alias as qwen3.5-9b-agent,
  # which loses that alias (the __Q359B_AGENT_ALIAS__ token above) when this seat
  # renders alongside it. REQUIRES llama.cpp >= b11102 (upstream #29319 — b10964
  # misroutes MiMo's compact tool-call XML to the Qwen3-Coder parser and every tool
  # call runs to the token cap). Ctx 65536 and the flash-attn/cache-type values are
  # LITERALS: the exact configuration the 2026-09-24 fit and quality bakes measured
  # on both 8GB reference boxes (6,926/7,034 MiB RTX 5060, 6,683/6,707 MiB RTX 3070
  # Laptop — both smaller than qwen3.5-9b-agent's footprint at the same window).
  mimo-9b-agent:
    aliases: [mimo-9b, agent-seat]
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/MiMo-V2.6-Distill-Qwen-9B-Q4_K_M.gguf
      --n-gpu-layers 999 --parallel 1 --ctx-size 65536 --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0 --threads __NTHREADS__ --reasoning off --jinja
      --port ${PORT} --host 127.0.0.1
    checkEndpoint: /health
    ttl: 300
  # AGENT seat for the 16GB class: Qwen3.8-27B UD-IQ3_S with the MTP head embedded in
  # the same GGUF (blk.64.nextn.*), drafted at depth 3. Gated on the tier's
  # include_qwen38_27b. It deliberately does NOT claim `agent-seat`: the 4B/9B entry
  # keeps that alias as the fallback, and the lane binds here through
  # config_seed.agent_model. The --ctx-size is a LITERAL, not __CTX__: 49,152 is the
  # window measured to fit (14,410 MiB of a 15,356 MiB card, INCLUDING the ~456 MiB
  # memory-stack embedder already resident) on the ampere-16 reference box. A larger
  # window aborts at load with CUDA out-of-memory. --reasoning off is the policy the
  # seat was measured under (ADR 0047); q8_0 KV holds the drafter at its measured
  # 0.59 acceptance on free text.
  qwen38-27b-agent:
    aliases: [qwen38-27b, 27b-agent]
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/Qwen3.8-27B-UD-IQ3_S.gguf
      --spec-type draft-mtp --spec-draft-n-max 3
      --n-gpu-layers 999 --parallel 1 --ctx-size 49152 --flash-attn __FLASH_ATTN__
      --cache-type-k __KV_K__ --cache-type-v __KV_V__ --cache-ram __CACHE_RAM__ __SLOT_SAVE__ --threads __NTHREADS__
      --jinja --reasoning off --port ${PORT} --host 127.0.0.1
    checkEndpoint: /health
    ttl: 300
  # AGENT seat for the 6GB tier on a box with host RAM to spare: Qwen3.6-35B-A3B
  # UD-IQ3_XXS (35B total, ~3B active, Apache-2.0, 12.30 GiB). The routed experts sit in
  # host RAM through `--n-cpu-moe 40`; attention, the dense layers and the KV cache stay on
  # the card. A RAM-SPILL seat (ADR 0080), admitted under the operator's 2026-10-07 ruling
  # "acceptable spill as long as it truly adds capability and does not become a RAM hog or
  # make the system unstable", and measured against exactly those three gates on the
  # reference 6 GB node (llama.cpp b10964): ADDS CAPABILITY - blind pack G4 (24 judgements),
  # overall 8.11 vs the incumbent Qwen3.5-4B's 7.26 (gap 0.85, bar 0.5), 17/24 head to head,
  # 1,399 s vs 4,818 s on the hard-8 set; NOT A RAM HOG - ~11.6 GB host RSS while loaded
  # (weights + 1 GiB), released on unload, MemAvailable never under 5,446 MiB on a 32 GB box
  # beside a game server; STABLE - no abort and zero swap-in across the runs with the flags
  # below. ~2.1 GB on the card at a 32768 window with q8_0 KV.
  #
  # Rendered only when the tier sets include_qwen36_35b AND the box's RAM tier can hold the
  # spill (low, mid or high; not `min`, and not an unspecified tier; install_render.go
  # spillSeatIncluded): the renderer strips this block, its matrix var and its set membership
  # together, so a box that cannot hold it renders without it and keeps the 4B as the agent seat. It is one more HEAVY alternative in the
  # interactive set (one heavy seat on the card at a time), never a co-resident. It claims
  # `agent-seat`; qwen3.5-4b-agent hands the alias off (the Q354B_AGENT_ALIAS token).
  #
  # Flags are LITERALS - the exact configuration the bake measured - and written explicitly
  # instead of via ${common}: ${common} pins `--reasoning off`, and this is a THINKING model
  # (no --reasoning flag on purpose). The ZERO host prompt cache is deliberate: it grew
  # ~1 GiB per digest run in the bake, and the tier's cache-ram figure would be stacked on
  # top of the 11.6 GB of experts. `--load-mode none` exists from llama.cpp
  # b10964 (it replaced --no-mmap). `--n-cpu-moe 40` is sanctioned by the tier's
  # n_cpu_moe_max (INV-1: the write gate refuses a render above the measured spill).
  # --threads matters here (the spilled experts run on the CPU threads). NO sampling flags:
  # the agent loop sends `temperature: 0` on every request.
  qwen3.6-35b-a3b-agent:
    aliases: [qwen36-35b, agent-seat]
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf
      --n-gpu-layers 99 --n-cpu-moe 40 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
      --ctx-size 32768 --jinja --threads __NTHREADS__ --batch-size 2048 --ubatch-size 512
      --parallel 1 --cache-ram 0 --load-mode none --port ${PORT} --host 127.0.0.1
    checkEndpoint: /health
    ttl: 300
  embeddinggemma:
    aliases: [text-embedding, local-embed]
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/embeddinggemma-300M-Q8_0.gguf
      --embeddings --pooling mean --ctx-size 2048 --batch-size 2048 --ubatch-size 2048
      --n-gpu-layers 99 --port ${PORT} --host 127.0.0.1
    checkEndpoint: /health
    ttl: 300
  # SECOND memory-stack embedder: EmbeddingGemma-2 Q8_0 with its multimodal projector (text,
  # image and short-video embeddings in one space), the embedder the memory stack is moving to.
  # Gated on the tier's include_embeddinggemma2 and a MEMBER OF THE STACK'S RESIDENCY SET (`emb & rer & eg2`): resident beside
  # the swappable seats, never swapped by them. The entry as written is the memory AUTHORITY's (ampere-6,
  # the card it was measured on). A tier whose embeddinggemma2_projector is false (ampere-8 and
  # blackwell-3x16: replicas that only embed text, on cards the projector does not fit beside their
  # seats) renders the SAME entry with its one projector argument (flag and GGUF path) stripped at
  # render (servingtmpl dropEG2Projector): every other flag stays, --ubatch-size 2048 included (the stack's
  # hot budget is 1,900 tokens; a smaller ubatch returns HTTP 500 on long memories). The projector's
  # filename stays below so the gated-weight contract test keeps pinning it against install.ps1.
  # No aliases: the memory stack selects the id. The
  # embeddinggemma (300M) entry above stays on every template for the harness's own embed lane
  # (kNN pre-filter, judge) and for callers of text-embedding / local-embed; retiring it is a
  # later release. Like that entry it bypasses ${common} (an embedder: no --jinja, no reasoning
  # flag). Flags are the measured configuration; MEASURED on the reference 6 GB node: 1,196 MiB
  # loaded, 1,466 MiB peak after image embeds, 1,536 MiB after a short video; without the
  # projector 460 MiB loaded and 482 MiB peak at --ubatch-size 2048. REQUIRES llama.cpp >= b11452 (the gemma-embedding2 architecture,
  # upstream PR #30054, merged 2026-10-06); b11490 is the build it was proven on.
  embeddinggemma2:
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/embeddinggemma-2-Q8_0.gguf
      --mmproj __MODELS__/mmproj-embeddinggemma-2-Q8_0.gguf --embeddings --pooling mean
      --ctx-size 4096 --batch-size 4096 --ubatch-size 2048 --n-gpu-layers 99 --flash-attn on
      --host 127.0.0.1 --port ${PORT}
    checkEndpoint: /health
    ttl: 300
  bge-reranker-v2-m3:
    aliases: [reranker-v2-m3]
    env: ["${ld}"]
    # GPU weights (2026-09-10 operator rule: no CPU inference; RAM is overflow only).
    # A-122b (measured 2026-10-01): each pair the memory stack scores (<= ~2,000 tokens) is ONE non-causal sequence that must fit one ubatch; 8192/4096/4096 failed to start beside the loaded ampere-16 agent seat 7 times (639 MiB free; 1,369 MiB at 4096/2048/2048).
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/bge-reranker-v2-m3-Q4_K_M.gguf
      --reranking --pooling rank --ctx-size 4096 --batch-size 2048 --ubatch-size 2048
      --n-gpu-layers 99 --port ${PORT} --host 127.0.0.1
    checkEndpoint: /health
    ttl: 300

# This template accepts tier-declared media seats. A tier declares a residency ROLE,
# never a set or group name: those are per-template, while a tier is a hardware class
# that renders into several templates. The SEATS_SWAPPABLE / SEATS_RESIDENT markers in
# the set expressions below (each wrapped in double underscores) say WHERE a seat of
# that role joins the matrix; this directive says WHICH roles are accepted at all.
# `env` is the macro a llama-backed seat carries —
# the loader path, which only this file needs. A template WITHOUT this directive
# renders no seats and refuses by name rather than dropping them silently.
# offload-seats: swappable resident env=${ld}
# RESIDENCY IS DECLARED WITH `matrix:`, NOT `groups:`. llama-swap replaced groups with
# matrix in v202; a config must use one or the other, never both. This is not a style
# preference — it is a MEASURED failure. On the workstation node, under `groups:`, an
# `exclusive: true` group evicted a `persistent: true` group anyway (verified live
# 2026-07-26): the reranker could not start, a rerank returned HTTP 000 after 90 s, and
# the memory stack silently degraded to dense-only ordering with no error anywhere.
# `persistent` did not do what its name promises. Matrix states the valid CONCURRENT
# COMBINATIONS instead of a priority the solver may reinterpret.
#
# Sets ARE those combinations. Residents appear in EVERY set, so the solver may never
# evict them to satisfy anything else — the property the old topology only approximated
# with swap:false, and the one the Windows templates got outright wrong.
#
# The rest is still MEASURED, not assumed. Two earlier shapes were tried on a 6 GB card
# sharing a live desktop and both broke the box:
#   1. an exclusive media group — the image seat evicted everything and NOTHING evicted
#      it, so every chat request returned 502 for the full 5-minute TTL after a render.
#   2. the embedder/reranker inside the swapping tier — loading the embedder DROPPED
#      free VRAM 3655 -> 1005 MiB because it had evicted the chat model, so one RAG
#      query paid three full model loads.
#
# REQUIRES llama-swap >= v202. Verified against the real binary: `vars` is mandatory,
# a var key must be alphanumeric and 1-8 characters, and a set expression may reference
# ONLY var ids — never a model id.
matrix:
  vars:
    emb: embeddinggemma
    rer: bge-reranker-v2-m3
    eg2: embeddinggemma2
    e4b: offload-e4b
    e2b: gemma4-e2b
    m26: gemma4-26b-a4b
    a26: gemma-4-26b-agent
    q354: qwen3.5-4b-agent
    q359: qwen3.5-9b-agent
    mimo9: mimo-9b-agent
    q3827: qwen38-27b-agent
    q36: qwen3.6-35b-a3b-agent
  # The memory stack is the most expensive thing on this box to lose and the cheapest to
  # keep: make it maximally expensive to stop, so if the solver ever does have a choice
  # it stops something else first.
  evict_costs:
    emb: 1000
    rer: 1000
    eg2: 1000
  sets:
    residents: "emb & rer__EG2_AND____SEATS_RESIDENT__"
    interactive: "+residents & (e4b | e2b__M26_ALT____Q354B_ALT____Q359B_ALT____MIMO9B_ALT____Q3827B_ALT____Q3635B_ALT____SEATS_SWAPPABLE__)"
