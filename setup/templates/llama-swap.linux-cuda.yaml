# llama-swap.linux-cuda.yaml — offload-harness family on the llama.cpp CUDA backend
# (Linux; NVIDIA GPU). Rendered by `local-offload install render`, which substitutes
# the __CTX__ / __KV_K__ / __KV_V__ / __FLASH_ATTN__ / __MOE_26B__ / __LLAMA_BIN__ /
# __MODELS__ / __NTHREADS__ / __LISTEN__ tokens from the detected tier and drops the
# 26B block entirely on a tier whose include_26b is false.
#
# Serving invariants (grammar reliability — do NOT change): --jinja, --flash-attn on,
# no MTP, reasoning off. Do NOT add --swa-full here: it was measured as load-bearing
# for the LARGE iSWA models only, and forcing a full attention window costs KV memory
# on exactly the tiers with the least VRAM headroom.
#
# LINUX-SPECIFIC AND LOAD-BEARING: every seat carries LD_LIBRARY_PATH pointing at the
# llama.cpp build dir. A self-built llama-server links its own shared objects; without
# it the process dies at exec with a loader error that looks nothing like a config
# problem. The Windows templates have no equivalent, which is one reason this file
# could not be a translation of them.
healthCheckTimeout: 300
logLevel: info
listen: __LISTEN__

macros:
  common: >-
    --ctx-size __CTX__ --flash-attn __FLASH_ATTN__ --cache-type-k __KV_K__ --cache-type-v __KV_V__
    --threads __NTHREADS__ --jinja --reasoning off --port ${PORT} --host 127.0.0.1
  ld: "LD_LIBRARY_PATH=__LLAMA_BIN__:${LD_LIBRARY_PATH:-}"

models:
  offload-e4b:
    aliases: [gemma4-e4b, offload]
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
      --n-gpu-layers 99 --parallel 1 ${common}
    checkEndpoint: /health
    ttl: 300
  gemma4-e2b:
    aliases: [e2b]
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
      --n-gpu-layers 99 ${common}
    checkEndpoint: /health
    ttl: 300
  gemma4-26b-a4b:
    env: ["GGML_CUDA_DISABLE_GRAPHS=1", "${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      __MOE_26B__ --parallel 1 ${common}
    checkEndpoint: /health
    ttl: 300
  embeddinggemma:
    aliases: [text-embedding, local-embed]
    env: ["${ld}"]
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/embeddinggemma-300M-Q8_0.gguf
      --embeddings --pooling mean --ctx-size 2048 --batch-size 2048 --ubatch-size 2048
      --n-gpu-layers 99 --port ${PORT} --host 127.0.0.1
    checkEndpoint: /health
    ttl: 600
  bge-reranker-v2-m3:
    aliases: [reranker-v2-m3]
    env: ["${ld}"]
    # --n-gpu-layers 0 ON PURPOSE: the reranker on CPU buys back ~245 MiB of VRAM
    # (measured) and it is never on a latency-critical path.
    cmd: >-
      __LLAMA_BIN__/llama-server --model __MODELS__/bge-reranker-v2-m3-Q4_K_M.gguf
      --reranking --pooling rank --ctx-size 8192 --batch-size 4096 --ubatch-size 4096
      --n-gpu-layers 0 --port ${PORT} --host 127.0.0.1
    checkEndpoint: /health
    ttl: 600

# This template accepts tier-declared media seats. A tier declares a residency ROLE,
# never a set or group name: those are per-template, while a tier is a hardware class
# that renders into several templates. The SEATS_SWAPPABLE / SEATS_RESIDENT markers in
# the set expressions below (each wrapped in double underscores) say WHERE a seat of
# that role joins the matrix; this directive says WHICH roles are accepted at all.
# `env` is the macro a llama-backed seat carries —
# the loader path, which only this file needs. A template WITHOUT this directive
# renders no seats and refuses by name rather than dropping them silently.
# offload-seats: swappable resident env=${ld}
# RESIDENCY IS DECLARED WITH `matrix:`, NOT `groups:`. llama-swap replaced groups with
# matrix in v202; a config must use one or the other, never both. This is not a style
# preference — it is a MEASURED failure. On the workstation node, under `groups:`, an
# `exclusive: true` group evicted a `persistent: true` group anyway (verified live
# 2026-07-26): the reranker could not start, a rerank returned HTTP 000 after 90 s, and
# the memory stack silently degraded to dense-only ordering with no error anywhere.
# `persistent` did not do what its name promises. Matrix states the valid CONCURRENT
# COMBINATIONS instead of a priority the solver may reinterpret.
#
# Sets ARE those combinations. Residents appear in EVERY set, so the solver may never
# evict them to satisfy anything else — the property the old topology only approximated
# with swap:false, and the one the Windows templates got outright wrong.
#
# The rest is still MEASURED, not assumed. Two earlier shapes were tried on a 6 GB card
# sharing a live desktop and both broke the box:
#   1. an exclusive media group — the image seat evicted everything and NOTHING evicted
#      it, so every chat request returned 502 for the full 5-minute TTL after a render.
#   2. the embedder/reranker inside the swapping tier — loading the embedder DROPPED
#      free VRAM 3655 -> 1005 MiB because it had evicted the chat model, so one RAG
#      query paid three full model loads.
#
# REQUIRES llama-swap >= v202. Verified against the real binary: `vars` is mandatory,
# a var key must be alphanumeric and 1-8 characters, and a set expression may reference
# ONLY var ids — never a model id.
matrix:
  vars:
    emb: embeddinggemma
    rer: bge-reranker-v2-m3
    e4b: offload-e4b
    e2b: gemma4-e2b
    m26: gemma4-26b-a4b
  # The memory stack is the most expensive thing on this box to lose and the cheapest to
  # keep: make it maximally expensive to stop, so if the solver ever does have a choice
  # it stops something else first.
  evict_costs:
    emb: 1000
    rer: 1000
  sets:
    residents: "emb & rer__SEATS_RESIDENT__"
    interactive: "+residents & (e4b | e2b__M26_ALT____SEATS_SWAPPABLE__)"
