[project]
name = "offload-browse-sidecar"
version = "0.1.0"
description = "Opt-in browse-lane sidecar for offload-harness (browser-use jev-ultrafast + browser-harness, newest at install)."
requires-python = ">=3.12"
dependencies = [
    "browser-harness>=0.1.13",
    "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast",
]

[tool.uv]
# The sidecar is a script (runner.py), not an installable package.
package = false
