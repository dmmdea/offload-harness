<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>callout-label</title>
    <style>
      /* Fonts are declared HERE, from the shared kit copied beside this file: Inter 400/900 (latin),
         byte-identical to the faces HyperFrames' producer embeds. A family the page does not declare
         with @font-face is resolved by the producer through a Google Fonts request, which is a network
         call at render time, so every family used below is declared. */
      @font-face { font-family: "Inter"; src: url("shared/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Inter"; src: url("shared/fonts/inter-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Transparent all the way down: rendered to webm (VP9 yuva420p) or mov (ProRes 4444) every pixel
         outside the callout carries alpha 0, ready to lay over footage. */
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Inter", sans-serif;
      }

      /* The whole unit slides out and fades in the last 0.5 s. */
      .callout {
        position: absolute;
        right: 80px;
        top: 340px;
        width: 500px;
        animation: out 0.5s cubic-bezier(0.4, 0, 1, 1) calc(var(--duration, 6) * 1s - 0.5s) forwards;
      }

      /* A soft haze of the accent behind the card. A radial gradient, not a blur filter: cheap, and it
         keeps alpha honest. */
      .haze {
        position: absolute;
        right: -80px;
        top: -70px;
        width: 660px;
        height: 480px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%, var(--accent, #34d399) 0%, transparent 70%);
        pointer-events: none;
        animation: haze-in 1.3s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* A translucent dark panel (the caller's --panel), like the lower third: footage shows faintly
         through it, and the text keeps its contrast on any shot. */
      .card {
        position: relative;
        padding: 32px 36px;
        overflow: hidden;
        border-radius: 28px;
        border: 1.5px solid rgba(255, 255, 255, 0.14);
        border-top-color: rgba(255, 255, 255, 0.24);
        background: var(--panel, rgba(12, 20, 18, 0.9));
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        animation: card-in 0.88s cubic-bezier(0.34, 1.4, 0.64, 1) 0.2s both;
      }

      /* A lit edge along the top of the card. */
      .rim {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, var(--accent, #34d399) 40%, var(--accent, #34d399) 60%, transparent 100%);
        opacity: 0.8;
      }

      .term {
        margin-bottom: 18px;
        font-size: 38px;
        font-weight: 900;
        line-height: 1.12;
        letter-spacing: -0.02em;
        color: var(--text_color, #f1f5f4);
        overflow-wrap: anywhere;
        animation: lift 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
      }

      .rule {
        height: 2px;
        margin-bottom: 20px;
        background: linear-gradient(90deg, var(--accent, #34d399) 0%, transparent 100%);
        transform-origin: 0% 50%;
        animation: draw 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.8s both;
      }

      .detail {
        font-size: 27px;
        font-weight: 400;
        line-height: 1.5;
        color: var(--text_color, #f1f5f4);
        overflow-wrap: anywhere;
        animation: lift-soft 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.98s both;
      }

      @keyframes haze-in { from { opacity: 0; transform: scale(0.55); } to { opacity: 0.16; transform: scale(1); } }
      @keyframes card-in { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes lift { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes lift-soft { from { opacity: 0; transform: translateY(12px); } to { opacity: 0.78; transform: translateY(0); } }
      @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes out { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(48px); } }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="callout-label"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-no-timeline
      data-composition-variables='[{"id":"term","type":"string","label":"Term","description":"The heading of the callout: the word or phrase being called out.","maxLength":32,"default":"Cold start"},{"id":"detail","type":"string","label":"Detail","description":"One or two sentences under the heading.","maxLength":110,"default":"The first request after a quiet spell is slower because the model must load."},{"id":"accent","type":"color","label":"Accent","description":"The lit top edge, the rule under the term and the haze.","default":"#34d399"},{"id":"panel","type":"color","label":"Panel","description":"The card behind the text; keep it translucent and dark so footage shows faintly through and the text keeps its contrast.","default":"rgba(12, 20, 18, 0.9)"},{"id":"text_color","type":"color","label":"Text color","default":"#f1f5f4"},{"id":"duration","type":"number","label":"Duration (seconds)","description":"Total length; the exit starts 0.5 s before the end.","min":3,"max":30,"default":6}]'
    >
      <div class="callout">
        <div class="haze"></div>
        <div class="card">
          <div class="rim"></div>
          <div class="term" data-var-text="term">Cold start</div>
          <div class="rule"></div>
          <div class="detail" data-var-text="detail">The first request after a quiet spell is slower because the model must load.</div>
        </div>
      </div>
    </div>
    <script>
      // CSS keyframes only, seeked by HyperFrames' CSS adapter; no clock, no randomness, no timers.
      window.__timelines = window.__timelines || {};
    </script>
  </body>
</html>
