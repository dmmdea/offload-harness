<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>stat-card</title>
    <style>
      /* Fonts are declared HERE, from the shared kit copied beside this file: Inter 400/700/900 (latin),
         byte-identical to the faces HyperFrames' producer embeds. A family the page does not declare
         with @font-face is resolved by the producer through a Google Fonts request, which is a network
         call at render time, so every family used below is declared. */
      @font-face { font-family: "Inter"; src: url("shared/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Inter"; src: url("shared/fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Inter"; src: url("shared/fonts/inter-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-style: normal; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }

      /* Every variable arrives as a --<id> custom property on the root (HyperFrames applies scalar
         variables there), so the colors and the exit timing read from the root. */
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--background, #0a1210);
        font-family: "Inter", sans-serif;
        color: var(--text_color, #f1f5f4);
      }

      /* Everything except the canvas lives in .stage, so the exit fades the whole card to the flat
         background in one motion. */
      .stage {
        position: absolute;
        inset: 0;
        animation: out 0.6s cubic-bezier(0.4, 0, 1, 1) calc(var(--duration, 6) * 1s - 0.6s) forwards;
      }

      /* Glow rising from the bottom edge, a soft dot texture and a halo behind the figure. Each is a
         radial gradient from the accent to transparent, so the intensity is one opacity value. */
      .bloom {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 85% at 50% 118%, var(--accent, #34d399) 0%, transparent 62%);
        transform-origin: 50% 120%;
        animation: bloom-in 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at center, rgba(255, 255, 255, 0.07) 1px, transparent 1.6px);
        background-size: 46px 46px;
        -webkit-mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
        mask-image: radial-gradient(120% 100% at 50% 60%, #000 35%, transparent 80%);
        animation: grid-in 1.1s cubic-bezier(0.33, 1, 0.68, 1) 0.2s both;
      }
      .halo {
        position: absolute;
        left: 530px;
        top: 58px;
        width: 860px;
        height: 860px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, var(--accent, #34d399) 0%, transparent 70%);
        animation:
          halo-in 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both,
          halo-breathe calc(max(var(--duration, 6) - 2.4, 1.2) * 1s / 2) ease-in-out 2.4s 2 forwards;
      }

      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 120px 60px;
        text-align: center;
      }

      .kicker {
        max-width: 1500px;
        margin-bottom: 24px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent, #34d399);
        overflow-wrap: anywhere;
        animation: focus-small 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
      }

      /* The figure: a white-to-accent gradient clipped to the glyphs. Wider than the frame it wraps
         instead of clipping. */
      .stat {
        max-width: 1720px;
        margin-bottom: 32px;
        font-size: 240px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.03em;
        overflow-wrap: anywhere;
        background: linear-gradient(160deg, var(--text_color, #f1f5f4) 10%, var(--accent, #34d399) 85%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: focus-large 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.8s both;
      }

      .label {
        max-width: 1000px;
        font-size: 32px;
        font-weight: 400;
        line-height: 1.45;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
        text-wrap: balance;
        animation: focus-medium 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.55s both;
      }
      /* Hierarchy by opacity: the plain parts recede, the emphasised phrase does not. */
      .label .plain { opacity: 0.76; }
      .label em { font-style: normal; font-weight: 700; color: var(--text_color, #f1f5f4); }

      .source {
        position: absolute;
        left: 80px;
        bottom: 44px;
        max-width: 1100px;
        font-size: 19px;
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        overflow-wrap: anywhere;
        animation: source-in 0.7s cubic-bezier(0.33, 1, 0.68, 1) 1.85s both;
      }

      /* Edges pulled toward black so the eye stays on the figure. */
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(125% 125% at 50% 45%, transparent 52%, rgba(0, 0, 0, 0.5) 100%);
      }

      /* Nothing here scales above its resting size: a halo breathing out to 1.06 gave frames that depended
         on which render worker drew them, so the breathing is opacity only (see the README). Entrances
         that scale UP TO 1 are stable. */
      @keyframes bloom-in { from { opacity: 0; transform: scale(0.88); } to { opacity: 0.42; transform: scale(1); } }
      @keyframes grid-in { from { opacity: 0; } to { opacity: 0.5; } }
      @keyframes halo-in { from { opacity: 0; transform: scale(0.6); } to { opacity: 0.18; transform: scale(1); } }
      @keyframes halo-breathe { 0% { opacity: 0.18; } 50% { opacity: 0.32; } 100% { opacity: 0.18; } }
      @keyframes focus-small { from { opacity: 0; transform: translateY(18px); filter: blur(8px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
      @keyframes focus-large { from { opacity: 0; transform: scale(0.82); filter: blur(28px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }
      @keyframes focus-medium { from { opacity: 0; transform: translateY(22px); filter: blur(10px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
      @keyframes source-in { from { opacity: 0; } to { opacity: 0.62; } }
      @keyframes out { from { opacity: 1; } to { opacity: 0; } }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="stat-card"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-no-timeline
      data-composition-variables='[{"id":"kicker","type":"string","label":"Kicker","description":"A short uppercase lead-in above the figure.","maxLength":40,"default":"Customer survey"},{"id":"stat","type":"string","label":"Figure","description":"The hero figure, such as 82% or 3.4x. Up to 12 characters; a wider figure wraps.","maxLength":12,"default":"82%"},{"id":"label_pre","type":"string","label":"Label before the emphasis","description":"The first part of the caption under the figure.","maxLength":80,"default":"of teams said the new"},{"id":"label_em","type":"string","label":"Label emphasis","description":"The emphasised phrase, in bold at full brightness. May be empty.","maxLength":40,"default":"onboarding flow"},{"id":"label_post","type":"string","label":"Label after the emphasis","description":"The last part of the caption. May be empty.","maxLength":80,"default":"saved them time in week one"},{"id":"source","type":"string","label":"Source line","description":"A small uppercase credit at the bottom left. May be empty.","maxLength":48,"default":"Source: internal survey, n=400"},{"id":"background","type":"color","label":"Background","default":"#0a1210"},{"id":"accent","type":"color","label":"Accent","description":"The kicker, the end of the figure gradient and the glow.","default":"#34d399"},{"id":"text_color","type":"color","label":"Text color","default":"#f1f5f4"},{"id":"duration","type":"number","label":"Duration (seconds)","description":"Total length; the exit fade starts 0.6 s before the end.","min":3,"max":30,"default":6}]'
    >
      <div class="stage">
        <div class="bloom"></div>
        <div class="grid"></div>
        <div class="halo"></div>

        <div class="content">
          <div class="kicker" data-var-text="kicker">Customer survey</div>
          <div class="stat" data-var-text="stat">82%</div>
          <div class="label"><span class="plain" data-var-text="label_pre">of teams said the new</span> <em data-var-text="label_em">onboarding flow</em> <span class="plain" data-var-text="label_post">saved them time in week one</span></div>
        </div>

        <div class="source" data-var-text="source">Source: internal survey, n=400</div>
        <div class="vignette"></div>
      </div>
    </div>
    <script>
      // CSS keyframes only, seeked by HyperFrames' CSS adapter; no clock, no randomness, no timers.
      window.__timelines = window.__timelines || {};
    </script>
  </body>
</html>
