version: 2
project_name: llamaswap-pp-cli
changelog:
  disable: true
builds:
  - id: llamaswap-pp-cli
    main: ./cmd/llamaswap-pp-cli
    binary: llamaswap-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X llamaswap-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: llamaswap-pp-mcp
    main: ./cmd/llamaswap-pp-mcp
    binary: llamaswap-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: llamaswap-pp-cli
    repository:
      owner: pepsdubai
      name: homebrew-tap
    homepage: "https://github.com/pepsdubai/llamaswap-pp-cli"
    description: "The llama-swap operations console — durable history, drain-aware control, and measurement commands that structurally cannot produce the errors operators actually make."
    install: |
      bin.install "llamaswap-pp-cli"
      bin.install "llamaswap-pp-mcp"
