# llama-swap admin + llama.cpp upstream passthrough — hand-authored spec.
#
# llama-swap publishes no OpenAPI document. Every endpoint below comes from the v249
# route registration (internal/server/server.go on mostlygeek/llama-swap main), the README,
# and was cross-checked against the LIVE v249 server on localhost:11436 on 2026-08-13
# (probes: /health, /running, /v1/models, /api/version, /upstream/{model}/props,
# /upstream/{model}/tokenize; UI sniff confirmed /api/metrics/activity query params).
#
# No auth: this deployment runs without apiKeys (llama-swap auth is optional config).
#
# TWO LAYERS in one surface:
#   1. llama-swap's own admin API (models, running, unload, profiles, metrics, logs, captures)
#   2. every model's full llama.cpp llama-server API, reached through /upstream/{model}/...
#      passthrough — props, slots, tokenize, embeddings, rerank, and friends.
#
# Operational facts baked into descriptions (verified on this deployment):
#   - GET /upstream/{model}/<anything> AUTO-STARTS the model if not running. A "probe" can
#     trigger a multi-GB load. Read-only inspection must check /running first.
#   - Unload during an in-flight generation does NOT drain: the request dies with 502
#     (measured on v242). Drain-aware unload = poll /upstream/{model}/slots is_processing.
#   - ttl: 0 models are deliberately resident (keep-set); on this box embeddinggemma and
#     bge-reranker-v2-m3 back the mem0 memory stack and must never be casually unloaded.

name: llamaswap
description: Administer a llama-swap model-swapping proxy and reach every model's full llama.cpp API through one command surface.
base_url: http://127.0.0.1:11436
version: "v249"

auth:
  type: none

cli_description: Command a llama-swap fleet from the shell — model roster, swap state, drain-aware unloads, live metrics, and every llama.cpp per-model endpoint — with a durable local record of swaps and speeds the server forgets on restart.

resources:
  server:
    description: Proxy-level health, version, and hardware identity.
    endpoints:
      health:
        method: GET
        path: /health
        no_auth: true
        description: >
          Liveness of the llama-swap proxy itself (plain "OK"). This says NOTHING about any
          model being loaded or ready — a green /health with an empty /running is the normal
          idle state. For per-model readiness use upstream health.
      version:
        method: GET
        path: /api/version
        no_auth: true
        description: >
          Returns {version, commit, build_date}. The capability gate for everything else:
          per-model unload routes need v24x+, /api/hardware needs v247+, profiles/selectors
          need v241+. Cache this and gate optional commands on it instead of guessing from 404s.
      hardware:
        method: GET
        path: /api/hardware
        no_auth: true
        description: >
          Hardware detection as llama-swap sees it (GPUs, VRAM). Added in v247 — returns 404 on
          older servers; treat 404 as "feature absent", not an error.

  models:
    description: The configured roster and live swap state.
    endpoints:
      list:
        method: GET
        path: /v1/models
        no_auth: true
        description: >
          Every CONFIGURED model (from config YAML), not just loaded ones. Extended fields per
          entry: name, description, architecture, capabilities, supported_parameters,
          context_length, status.value, and meta.llamaswap.aliases. CRITICAL: data[].id is the
          canonical id; harness-bound aliases hide in meta.llamaswap.aliases — matching id alone
          reports a correctly-served alias as missing (the exact bug in 2 of 3 clients in the
          offload-harness today). This roster is CONFIG-derived: a model whose GGUF file was
          never downloaded still appears here and fails only when called.
      running:
        method: GET
        path: /running
        no_auth: true
        description: >
          Only the models currently holding VRAM: {running:[{model, state, cmd, proxy, ttl,
          name, description}]}. state is "ready" once health-checked. ttl==0 means deliberately
          resident (keep-set); any other ttl means the model self-unloads after idle. This is
          the ground truth for "what is actually loaded" — /v1/models is config, /running is VRAM.
      unload:
        method: POST
        path: /api/models/unload/{model}
        no_auth: true
        description: >
          Unload ONE model by id. WARNING (measured on this deployment): an unload issued during
          an in-flight generation returns in ~1.3s WITHOUT draining and the in-flight request
          dies with 502. Check /upstream/{model}/slots is_processing (or /running + activity)
          before unloading anything that might be serving. Route exists on v24x+.
        params:
          - name: model
            in: path
            type: string
            required: true
            description: Model id (canonical id from /v1/models, not an alias).
      unload_all:
        method: POST
        path: /api/models/unload
        no_auth: true
        description: >
          Unload EVERY model, including ttl:0 keep-set residents. On this deployment that kills
          the mem0 memory stack (embeddinggemma + bge-reranker-v2-m3) until their next request
          re-warms them. Prefer per-model unload with a keep-set exclusion.

  profiles:
    description: Config profiles (v241+ selectors) — named model groupings.
    endpoints:
      list:
        method: GET
        path: /api/profiles
        no_auth: true
        description: List configured profiles and which one is active. 404 on pre-v241 servers.
      activate:
        method: PUT
        path: /api/profiles/active
        no_auth: true
        description: Switch the active profile. Body is the profile selection object.
        body_fields:
          - name: profile
            type: string
            required: true
            description: Profile name to activate.

  inflight:
    description: Requests currently being served through the proxy.
    endpoints:
      cancel:
        method: POST
        path: /api/inflight/{id}/cancel
        no_auth: true
        description: >
          Cancel one in-flight request by its id (ids visible in the activity feed / UI
          in-flight table). The polite alternative to unloading a model out from under a stuck
          request.
        params:
          - name: id
            in: path
            type: string
            required: true
            description: In-flight request id.

  activity:
    description: Request history and performance metrics kept in the proxy's memory (lost on restart).
    endpoints:
      log:
        method: GET
        path: /api/metrics/activity
        no_auth: true
        description: >
          Per-request activity log: id, timestamp, model, HTTP status, cached/prompt/generated
          token counts, prompt speed, generation speed, duration. Model-scoped, paginated and
          sortable via query params (verified live against the v249 UI). This history is
          IN-MEMORY — a proxy restart zeroes it, which is exactly why the CLI mirrors it into
          SQLite.
        params:
          - name: model
            in: query
            type: string
            required: false
            description: Filter to one model id.
          - name: page
            in: query
            type: integer
            required: false
            description: Page number (1-based).
          - name: limit
            in: query
            type: integer
            required: false
            description: Rows per page.
          - name: sort
            in: query
            type: string
            required: false
            description: Sort column (e.g. id, time, duration).
          - name: order
            in: query
            type: string
            required: false
            description: asc or desc.
      stats:
        method: GET
        path: /api/metrics/stats
        no_auth: true
        description: Aggregated activity stats (request counts, token totals) since proxy start.
      performance:
        method: GET
        path: /api/performance
        no_auth: true
        description: Performance metrics feed backing the UI's Performance page (per-model speed distributions).
      prometheus:
        method: GET
        path: /metrics
        no_auth: true
        description: >
          Prometheus exposition of proxy metrics. Returns 503 when monitoring is disabled in
          config — treat 503 as "feature off", not proxy-down.

  captures:
    description: Stored request/response captures (pairs with captureBuffer config).
    endpoints:
      get:
        method: GET
        path: /api/captures/{id}
        no_auth: true
        description: >
          Full request/response capture for one activity entry — the body-level diagnostic for
          "what did the client actually send and what came back". 404 when capture wasn't
          enabled or the buffer rotated past this id.
        params:
          - name: id
            in: path
            type: string
            required: true
            description: Activity/capture id.

  logs:
    description: Proxy and upstream process logs.
    endpoints:
      get:
        method: GET
        path: /logs
        no_auth: true
        description: >
          Buffered recent logs as plain text (proxy + upstream stdout/stderr interleaved).
          For live following the server also exposes SSE at /logs/stream and per-source
          /logs/stream/{proxy|upstream|model_id} — the CLI's follow mode consumes those.

  upstream:
    description: >
      Passthrough to one model's full llama.cpp llama-server API. TRAP: any request here
      AUTO-STARTS the target model if it is not running — a multi-GB load triggered by a
      "probe". Inspection commands must gate on /running first.
    endpoints:
      props:
        method: GET
        path: /upstream/{model}/props
        no_auth: true
        description: >
          llama-server properties for one model: build_info, model_path, chat_template,
          modalities, total_slots, default_generation_settings (incl. the REAL loaded n_ctx —
          the authority for context-window sizing; assuming ctx from config has killed real
          runs with exceed_context_size 400s).
        params:
          - name: model
            in: path
            type: string
            required: true
            description: Model id (auto-starts the model if idle).
      health:
        method: GET
        path: /upstream/{model}/health
        no_auth: true
        description: Per-model readiness ({"status":"ok"} once loaded; 503 while loading).
        params:
          - name: model
            in: path
            type: string
            required: true
      slots:
        method: GET
        path: /upstream/{model}/slots
        no_auth: true
        description: >
          Per-slot state incl. is_processing — the drain signal before unload. CAVEATS: needs
          llama-server started with --slots (404/501 otherwise — on this deployment most seats
          do not pass it); on non-llama.cpp upstreams (whisper-server) 404 is ambiguous with
          "not loaded" and must be cross-checked against /running; slot state exposes prompt
          content, so treat output as sensitive.
        params:
          - name: model
            in: path
            type: string
            required: true
      tokenize:
        method: POST
        path: /upstream/{model}/tokenize
        no_auth: true
        description: >
          Tokenize text with the model's own tokenizer. The honest answer to "does this fit the
          context window" — chars/4 estimates are ~2x off on Gemma-family tokenizers (measured).
        params:
          - name: model
            in: path
            type: string
            required: true
        body_fields:
          - name: content
            type: string
            required: true
            description: Text to tokenize.
          - name: with_pieces
            type: boolean
            required: false
            description: Return token pieces alongside ids.
      detokenize:
        method: POST
        path: /upstream/{model}/detokenize
        no_auth: true
        description: Convert token ids back to text.
        params:
          - name: model
            in: path
            type: string
            required: true
        body_fields:
          - name: tokens
            type: array
            required: true
            description: Token ids.
      apply_template:
        method: POST
        path: /upstream/{model}/apply-template
        no_auth: true
        description: >
          Render OpenAI-style messages through the model's chat template WITHOUT generating —
          returns the exact prompt string. Pair with tokenize for precise budget math.
        params:
          - name: model
            in: path
            type: string
            required: true
        body_fields:
          - name: messages
            type: array
            required: true
            description: OpenAI-style messages array.
      embeddings:
        method: POST
        path: /upstream/{model}/v1/embeddings
        no_auth: true
        description: >
          Embeddings from an embedding-capable model (on this deployment embeddinggemma, 768-dim,
          resident). Also dispatchable proxy-wide at /v1/embeddings; the upstream form pins the
          exact model.
        params:
          - name: model
            in: path
            type: string
            required: true
        body_fields:
          - name: input
            type: string
            required: true
            description: Text (or array of texts) to embed.
      rerank:
        method: POST
        path: /upstream/{model}/v1/rerank
        no_auth: true
        description: >
          Rerank documents against a query with a reranker model (on this deployment
          bge-reranker-v2-m3, resident, CPU-bound). Note the harness config declares rerank as a
          first-class roster member but today only a bench script can reach it — this command
          closes that gap.
        params:
          - name: model
            in: path
            type: string
            required: true
        body_fields:
          - name: query
            type: string
            required: true
            description: The query.
          - name: documents
            type: array
            required: true
            description: Documents to score.
      metrics:
        method: GET
        path: /upstream/{model}/metrics
        no_auth: true
        description: Per-model llama-server Prometheus metrics (needs --metrics on the seat; 404 otherwise).
        params:
          - name: model
            in: path
            type: string
            required: true
      lora_adapters:
        method: GET
        path: /upstream/{model}/lora-adapters
        no_auth: true
        description: List LoRA adapters loaded on this model and their scales.
        params:
          - name: model
            in: path
            type: string
            required: true
      lora_set:
        method: POST
        path: /upstream/{model}/lora-adapters
        no_auth: true
        description: Set LoRA adapter scales on this model.
        params:
          - name: model
            in: path
            type: string
            required: true
        body_fields:
          - name: adapters
            type: array
            required: true
            description: Array of {id, scale} adapter settings.

mcp:
  transport: [stdio, http]
  orchestration: code
  endpoint_tools: hidden
