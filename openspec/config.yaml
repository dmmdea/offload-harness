schema: harness-change

context: |
  offload-harness is a public, local-first Go harness: a free local model cascade does short, low-judgment work and
  returns a Defer (a valid result, never an error) instead of falling back to a cloud model. Everything written here
  lands in a public repository and must respect these standing invariants:
  - Quality outranks speed (INV-5). No pass rule, verdict, ranking, seat decision or acceptance line carries a
    wall-time term; speed may appear only as a side column.
  - No model runs on the CPU (INV-1). Attention, dense layers and the KV cache stay on the cards; host RAM is
    overflow only, bounded and released on unload.
  - Every idle model unloads after 300 s (INV-2), on every engine and tier.
  - No new daemon, scheduler, listener or watchdog without the operator's explicit yes. Fail loud; do not self-recover.
  - Never add a cloud fallback: a Defer is the answer (ADR 0001).
  - Public-repo privacy. Name a machine by tier id (for example blackwell-3x16) or node letter (node-a to node-f),
    never by host name; no personal names, local paths, addresses or account names. The leak gate fails the build
    on a hit and has no allow list: rewrite the text.
  - One changelog fragment per change under changes/unreleased/ (named for the branch); never edit CHANGELOG.md.
  - A decision that shapes the system beyond one implementation detail needs an ADR in docs/architecture/decisions/.
    Agents draft it as Proposed; a human accepts it.
  - Red-first tests: the failing test lands before the fix, and a new gate is proved by a mutation that turns it red.
  - Docs change in the same PR; system pages keep their Purpose and Source map sections (go test -run TestDocsLint .).
  - Third-party software enters only through the admission checks in docs/systems/security.md (pinned version and
    sha256, telemetry off, data off the system drive).

rules:
  proposal:
    - "State what is out of scope and which of the invariants above the change touches, or say none."
    - "Name any decision that will need an ADR. Set skip_specs: true for a change that alters no behavior."
  specs:
    - "Every scenario is testable. No requirement or scenario uses a wall-time bound as a pass condition."
  design:
    - "Name each ADR the change needs by title; the optional adr artifact drafts it. No decision, no ADR."
    - "Say how the leak gate, TestDocsLint and the changelog fragment apply. Machines by tier id or node letter only."
  tasks:
    - "In each group the first task writes the failing test; the task that makes it pass follows it."
    - "Every task names the command that verifies it, with a pass condition that has no wall-time term."
    - "The changelog fragment and the docs update sit in the group that changes behavior, not in a final group."
  adr:
    - "Status Proposed, a quoted date, title '# NNNN — Title'. A human assigns the number and adds the index row."
