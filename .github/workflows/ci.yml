name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here only reads the repository (checkout, caches and artifacts use
# their own runtime token). Added with the leak gate, whose key is a secret.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # The deletion guard below diffs against the base branch and against
          # HEAD's first parent; neither ref exists in a depth-1 checkout.
          fetch-depth: 0

      # H-51. Every other gate reads the tree it is handed, so a tree that is
      # simply MISSING a merged feature passes all of them — which is how #324
      # merged a tree rebuilt on an older base and silently dropped two releases.
      # This is the only check that reads what a change LOST. It runs first
      # because a branch missing merged work should not cost a build.
      #
      # On a pull request the base is the base branch tip; on a push to main it is
      # HEAD's first parent, which is the shape that went unseen. PR_BODY goes
      # through the environment, never interpolated into the shell.
      - name: Deletions are declared (H-51)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          bash ./scripts/check-deletions.sh "origin/$BASE_REF" HEAD

      - name: Deletions are declared (H-51, merge against its first parent)
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git rev-parse --verify --quiet 'HEAD^2' || true)" ]; then
            echo "check-deletions: HEAD is not a merge commit — the pull request run covered it"
            exit 0
          fi
          bash ./scripts/check-deletions.sh 'HEAD^1' HEAD

      # H-26. go.mod names the toolchain that ships (`toolchain go1.27.3`). This step only installs a
      # go command to start from: with GOTOOLCHAIN at its default (auto) the first go command below
      # reads that line, fetches the release and runs under it, so build, vet and test judge the
      # compiler that ships. setup-go@v5 leaves GOTOOLCHAIN alone. From v6 the action exports
      # GOTOOLCHAIN=local, and under it the go command ignores a toolchain line without a word, so a
      # bump to v6 must read go.mod (`go-version-file: go.mod`, and no `go-version`, which would win)
      # instead of naming 1.26.x; TestCISetupGoLeavesTheToolchainSwitchAlone fails until it does, and
      # accepts exactly that.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # H-26. The switch described above can stop working without a message, and then the job is green on a
      # compiler that does not ship: GOTOOLCHAIN=local (setup-go from v6 exports it; a runner image can set it)
      # makes the go command ignore the toolchain line. This step asks the go command itself, before anything else
      # uses it, and fails unless it runs exactly the release the line names; its log line names both.
      # Exactly, because the govulncheck job scans under that release and the jobs must not disagree about
      # which compiler ships; raise `go-version` past the pin only together with the pin.
      - name: The go command runs the toolchain go.mod names (H-26)
        shell: bash
        run: |
          set -euo pipefail
          want=$(awk '$1 == "toolchain" { sub(/\r$/, "", $2); print $2; exit }' go.mod)
          if ! [[ "$want" =~ ^go[0-9]+\.[0-9]+(\.[0-9]+|rc[0-9]+)?$ ]]; then
            echo "::error file=go.mod::go.mod has no usable toolchain line (found '$want'); H-26 pins one"
            exit 1
          fi
          if ! have=$(go env GOVERSION | tr -d '\r'); then
            echo "::error::'go env GOVERSION' failed, so the compiler this job runs is unknown (go.mod's toolchain line names '$want')"
            exit 1
          fi
          echo "go.mod names $want; the go command runs $have"
          if [ "$have" != "$want" ]; then
            echo "::error::the go command runs '$have' and go.mod's toolchain line names '$want': the line was not applied (GOTOOLCHAIN=local?), so this job does not judge the compiler that ships"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # H-55 leak gate (docs/systems/leak-gate.md). TestTrackedTreeCarriesNoDeniedNames
      # reads the keyed list digest in testdata/ and needs the key. The secret is an
      # empty string when it does not exist (a fork's pull request; the previous key on
      # every ordinary run), and the test reads an empty value as "unset", never as a
      # malformed key. REQUIRED is "1" on a push and on a pull request from this
      # repository, where a missing key is a failure; on a fork's pull request it is
      # empty and the test skips visibly (the summary line says "skipped"). The key is
      # visible to everything this one step runs, so no other step gets it.
      - name: Test
        env:
          OFFLOAD_LEAK_GATE_KEY: ${{ secrets.OFFLOAD_LEAK_GATE_KEY }}
          OFFLOAD_LEAK_GATE_KEY_PREV: ${{ secrets.OFFLOAD_LEAK_GATE_KEY_PREV }}
          OFFLOAD_LEAK_GATE_REQUIRED: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '' }}
        run: go test ./...

      # resolve_runner_exe (linux-node-swap-launch.sh) is pure/synthetic like the
      # windows-node-swap-launch.tests.ps1 job below: fakes stand in for
      # hash/support/log, no real binary or process spawn, so ubuntu-latest is a
      # valid host with no fleet node needed. This is the 2026-09-24 fix's Linux
      # half — see internal/nodeswap and the sibling installer-windows job's
      # windows-node-swap-launch self-test for the Windows half.
      - name: linux-node-swap-launch.sh runner-selection self-test
        run: bash ./setup/linux-node-swap-launch.tests.sh

      # The render runners are ~170 node:test assertions that were never in CI.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Test render runners
        run: node --test render/*.test.mjs

  # The installer's own suites drifted silently for two releases (0.36.0 moved the
  # templates to `matrix:` and three render.tests.ps1 assertions kept asserting
  # `groups:`) because nothing ran them. They are pure/synthetic — detect.tests.ps1
  # drives detect.ps1 -SelfTest over synthetic tuples, and render.tests.ps1 renders
  # with OFFLOAD_BACKEND/OFFLOAD_PROFILE set so no hardware detection happens — so a
  # runner is a valid host for both. render.tests.ps1 needs Go: rendering is delegated
  # to `local-offload install render` (ADR 0021) and it builds the renderer once.
  installer-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # H-26: go.mod's toolchain line applies here as in the build job (see the comment there).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # H-26: the same proof as in the build job, here on the Windows runner (bash, whose go.exe answers the
      # same question).
      - name: The go command runs the toolchain go.mod names (H-26)
        shell: bash
        run: |
          set -euo pipefail
          want=$(awk '$1 == "toolchain" { sub(/\r$/, "", $2); print $2; exit }' go.mod)
          if ! [[ "$want" =~ ^go[0-9]+\.[0-9]+(\.[0-9]+|rc[0-9]+)?$ ]]; then
            echo "::error file=go.mod::go.mod has no usable toolchain line (found '$want'); H-26 pins one"
            exit 1
          fi
          if ! have=$(go env GOVERSION | tr -d '\r'); then
            echo "::error::'go env GOVERSION' failed, so the compiler this job runs is unknown (go.mod's toolchain line names '$want')"
            exit 1
          fi
          echo "go.mod names $want; the go command runs $have"
          if [ "$have" != "$want" ]; then
            echo "::error::the go command runs '$have' and go.mod's toolchain line names '$want': the line was not applied (GOTOOLCHAIN=local?), so this job does not judge the compiler that ships"
            exit 1
          fi

      # D-98. The Windows cage's environment proof runs here, on a Windows runner, on every change. Its
      # two tests are SKIP stubs on every other OS, so `go test ./...` in the build job proves nothing
      # about them, and until this step the proof ran only on a developer's own Windows machine.
      # `go test` exits 0 when -run matches nothing and when the tests skip, so the step demands the
      # `--- PASS:` line of each test itself; bash, which the runner starts with pipefail on, stops a
      # failing test from hiding behind the pipe to tee. It sits before the PowerShell self-tests so an
      # unrelated failure there cannot hide it. Phase 2 widens it to the whole ./internal/sandbox/...
      # package once the tests that cover the exit-status reading are merged.
      - name: Windows cage environment proof (D-98)
        shell: bash
        run: |
          set -euo pipefail
          log=$(mktemp)
          go test -count=1 -timeout 5m -v -run '^TestWindowsChild' ./internal/sandbox/ | tee "$log"
          missing=0
          for name in TestWindowsChildDoesNotInheritParentSecrets TestWindowsChildGetsTheAllowlistedEnvironment; do
            if ! grep -q -e "^--- PASS: $name " "$log"; then
              echo "::error::no '--- PASS: $name' line: the proof was skipped or did not run"
              missing=1
            fi
          done
          exit "$missing"

      - name: detect.ps1 classifier self-test
        shell: powershell
        run: .\setup\detect.tests.ps1

      # Build the renderer explicitly so the render self-test does not do it itself
      # inside PowerShell on a cold runner. render.tests.ps1 self-builds for local dev
      # convenience, but CI should build once, deterministically, and fail on the BUILD
      # step (with go's own error) rather than inside a PowerShell throw.
      - name: Build the renderer
        shell: powershell
        run: go build -o ${{ runner.temp }}\local-offload-render.exe .

      - name: install.ps1 render self-test
        shell: powershell
        env:
          OFFLOAD_HARNESS_EXE: ${{ runner.temp }}\local-offload-render.exe
        run: .\setup\render.tests.ps1

      # The config-seed suite covers the OTHER half of the tier mechanism: what the
      # install SEEDS and DOWNLOADS, where render.tests.ps1 covers what it RENDERS.
      # It was never wired in, and unwired it rotted: it sat red for five assertions
      # that were correctly reporting two real defects in Merge-ConfigSeed (an
      # unexpanded __EXE__ in sdcpp_bin, and vae_mode never translated to its flag),
      # while new assertions added to it inherited zero regression value.
      - name: install.ps1 config-seed self-test
        shell: powershell
        run: .\setup\tests\install-config-seed.test.ps1

      # Quote-ArgForNativeArgv encodes every node-swap argument for a
      # Win32_Process.Create command-line string; a bad escape there silently
      # corrupts argv for the Go binary on the other end (PR #476 review). The
      # self-test round-trips its output through the real CommandLineToArgvW
      # Win32 API, so this needs no Go build — pure PowerShell + Win32.
      - name: windows-node-swap-launch.ps1 argv-quoting self-test
        shell: powershell
        run: .\setup\windows-node-swap-launch.tests.ps1

  # Printed CLIs under tools/ are SEPARATE Go modules (docs/systems/printed-clis.md),
  # so the `build` job's `./...` does not reach them — Go excludes nested modules from a
  # parent's package pattern. Without a job of their own they would be vendored code that
  # nothing ever compiles. One job per printed CLI.
  #
  # The suite is offline by construction: it touches the network only to assert a FAILURE
  # path (ProbeReachable against a closed port), so a runner with no ComfyUI installed is
  # a valid host for every package — nothing is excluded and no mock-mode env var is set.
  # The PRINTING_PRESS_* vars govern the Printing Press's own verify/dogfood runners, not
  # `go test`, and are deliberately left unset here.
  tools-comfyui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/comfyui
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: tools/comfyui/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  # Second printed CLI, same contract as tools-comfyui above.
  #
  # This one drives llama-swap, and parts of its suite are deliberately coupled to a
  # REAL deployment: internal/gguf reads model files off the model volume, and the
  # seat-log corpus tests assert independently-verified facts about a reference
  # llama-swap backup corpus. Those are machine-specific acceptance gates, and they
  # t.Skip when the resource is absent — verified on Linux with the model volume, the
  # corpus, and the server all missing: 750 pass, 7 skip, 0 fail. So CI runs the whole
  # module and excludes nothing; the skips ARE the intended behavior on a bare runner,
  # and a failure here means a guard regressed, not that the runner lacks hardware.
  #
  # LLAMASWAP_BASE_URL is left unset on purpose: the default points at a loopback port
  # that is closed on a runner, which is what the offline paths expect.
  tools-llamaswap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/llamaswap
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: tools/llamaswap/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  # integrations/opencode is the harness's opencode integration path — a TypeScript plugin
  # opencode runs under Bun. It ships and is versioned WITH the harness (one harness for
  # every agent; never a separate repo), so its gates run here: typecheck + bun test
  # (hooks driven directly with synthetic inputs; no opencode, no model, no network).
  integrations-opencode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/opencode
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # H-26 (supply-chain lane). Every pull request and push is scanned for known vulnerabilities with
  # the compiler that ships. The root module and both printed CLIs under tools/ (separate modules,
  # which the root's `./...` never reaches) are scanned for linux AND windows, because some advisories
  # name one OS.
  #
  # The scanner is pinned to a release tag, so a new release of it cannot change what a change is
  # judged by; raising it is a one-line edit. The advisory data is not pinned, on purpose: a new
  # advisory turns this job red between releases, and the fix is a bump of the pin in go.mod or of
  # the dependency.
  #
  # GOTOOLCHAIN comes from go.mod's toolchain line. That runs the printed CLIs (no toolchain line of
  # their own) under the same compiler and builds govulncheck with it, because `go install
  # pkg@version` ignores the current module's toolchain line. A go.mod without the line fails the
  # step: an empty GOTOOLCHAIN means "default", and the job would carry on with the runner's own
  # compiler and call it pinned.
  #
  # govulncheck exits 3 when the code calls a vulnerable function and 1 when the scan could not run
  # (the vulnerability database is unreachable, a package does not load). All six scans always run,
  # and the step fails if any of them did not exit 0.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # No module cache: this job downloads a compiler, a scanner and three dependency graphs it never
      # builds, and a cache restored into a security scan is one more thing to trust.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Use the toolchain go.mod names
        run: |
          set -euo pipefail
          toolchain=$(awk '$1 == "toolchain" { sub(/\r$/, "", $2); print $2; exit }' go.mod)
          if ! [[ "$toolchain" =~ ^go[0-9]+\.[0-9]+(\.[0-9]+|rc[0-9]+)?$ ]]; then
            echo "::error file=go.mod::go.mod has no usable toolchain line (found '$toolchain'); H-26 pins one"
            exit 1
          fi
          echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "govulncheck runs under $toolchain"

      - name: Install govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          gopath=$(go env GOPATH)
          echo "$gopath/bin" >> "$GITHUB_PATH"

      - name: Scan every module for both operating systems
        run: |
          set -uo pipefail
          status=0
          for dir in . tools/comfyui tools/llamaswap; do
            for goos in linux windows; do
              echo "=== govulncheck in $dir for GOOS=$goos ==="
              if ! (cd "$dir" && GOOS="$goos" govulncheck -show version ./...); then
                echo "::error::govulncheck did not exit 0 in $dir for GOOS=$goos"
                status=1
              fi
            done
          done
          exit "$status"
